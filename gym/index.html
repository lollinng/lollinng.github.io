<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Gym</title>
<meta name="description" content="Training plan, rest timer, meal prep and sleep log. Offline, data stays on the device.">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#today" aria-label="Today"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg></a>
  <h1 id="title">Gym</h1>
  <nav class="toplinks" aria-label="More">
    <a href="#plan" aria-label="The plan"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M8 4h8M9 2h6v4H9zM6 4H5a1 1 0 0 0-1 1v15a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-1M8 11h8M8 15h5"/></svg></a>
    <a href="#settings" aria-label="Settings"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></a>
  </nav>
</header>

<main id="view" class="view"></main>

<div id="timer" class="timer" hidden role="timer" aria-live="off">
  <div class="timer-fill" id="timer-fill"></div>
  <div class="timer-in">
    <button class="tbtn" data-act="restAdj" data-d="-15" aria-label="15 seconds less">−15</button>
    <div class="timer-mid"><div id="timer-time" class="timer-time">0:00</div><div id="timer-label" class="timer-label"></div></div>
    <button class="tbtn" data-act="restAdj" data-d="15" aria-label="15 seconds more">+15</button>
    <button class="tbtn skip" data-act="skipRest" aria-label="Skip rest">Skip</button>
  </div>
</div>

<nav id="nav" class="nav" aria-label="Sections">
  <a href="#today" data-v="today"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Today</span></a>
  <a href="#train" data-v="train"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg><span>Train</span></a>
  <a href="#food" data-v="food"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0zM8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg><span>Food</span></a>
  <a href="#sleep" data-v="sleep"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span>Sleep</span></a>
  <a href="#stats" data-v="stats"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Progress</span></a>
</nav>

<dialog id="dlg" aria-label="Details"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<noscript><p style="padding:24px">This app needs JavaScript.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
