  { id:'w16', cat:'narrate', topic:'Write the story of how your team shipped (or failed to ship) the last release — as a story, with a turn in the middle.', reader:'An engineer at another company', hints:['Stories need a turn: the day it stopped being routine. Build around that day.','Skeleton: the plan → the turn → the scramble → what shipped → the one-line moral.','Opening line: “Every release has a day where the plan dies. Ours was a Tuesday.”'] },
  { id:'w17', cat:'narrate', topic:'Describe an elder’s kitchen from memory, precisely enough that someone could draw it.', reader:'Someone who will sketch it', hints:['Spatial order: pick a corner and sweep the room one way. No doubling back.','Skeleton: standing at the door → left wall → the stove and its zone → the smells that lived there.','Opening line: “Stand at the door. The room opens to the left, and that is where we start.”'] },
  { id:'w18', cat:'argue', topic:'Make the case, to a committed cricket fan, that football is worth their time — without insulting cricket.', reader:'A cricket fan', hints:['One argument done well beats three done thin. Pick your single strongest.','Skeleton: the claim → your best reason → one concrete match as proof → the claim again, sharper.','Opening line: “Ninety minutes, no breaks, and the whole thing can turn in eight seconds — that is my case.”'] },
  { id:'w19', cat:'argue', topic:'Argue for or against: every engineer should work six months in support. Pick a side and hold it.', reader:'Your engineering director', hints:['Choose the side you can defend with a real example you have seen, not the side that sounds noble.','Skeleton: position → strongest reason → the real example → answer the obvious objection → restate.','Opening line: “I would put every engineer on support duty, and one incident from last quarter is my whole argument.”'] },
  { id:'w20', cat:'argue', topic:'Your city wants to ban private cars from one central road. Write the strongest case for one side, to a councillor.', reader:'A city councillor', hints:['Argue from one street you actually know. Local beats abstract.','Skeleton: the proposal → who wins, concretely → the loudest objection, answered → the ask.','Opening line: “Take one road you know at 6pm and I can show you the whole argument.”'] },
  { id:'w21', cat:'argue', topic:'A friend wants to skip college for a coding bootcamp. Write your honest advice, one page.', reader:'A 19-year-old friend', hints:['Advice is an argument with stakes. Commit to a recommendation; hedged advice is no advice.','Skeleton: their situation as you understand it → your recommendation in one sentence → the two reasons → the condition under which you’d flip.','Opening line: “You asked what I would do, so here it is with no padding.”'] },
  { id:'w22', cat:'argue', topic:'Make the case to your team that meetings need a written agenda or shouldn’t happen. Anticipate the pushback.', reader:'Your team lead', hints:['The objection you dodge is the one the reader is already thinking. Name it before they do.','Skeleton: the cost as it stands → the rule → the obvious pushback (“too rigid”) answered → what week one looks like.','Opening line: “I counted what our meetings cost last week, and I want to propose one rule.”'] },
  { id:'w23', cat:'process', topic:'Write instructions for your best chai (or coffee) so exact that a stranger gets your result first try.', reader:'A stranger in your kitchen', hints:['Quantities, times, and the one signal people miss — the sound, the colour, the foam.','Skeleton: what to gather → steps in strict order → the two moments it goes wrong → how to know it is done.','Opening line: “Everyone thinks they make good chai. Follow this exactly and then we will talk.”'] },
  { id:'w24', cat:'process', topic:'Write the checklist you would hand a friend for their first solo flight through an Indian airport.', reader:'A first-time flyer', hints:['Order it by the building: door → counter → security → gate. The building is the structure.','Skeleton: before leaving home → the counter → security and the tray ritual → finding the gate → the two announcements that matter.','Opening line: “The airport is just four queues in a row. Here is what each one wants from you.”'] },
  { id:'w25', cat:'process', topic:'Teach a friend to parallel park in five steps, on paper, without diagrams.', reader:'A new driver', hints:['Landmarks on the car itself (“when the mirror lines up with…”), not angles and degrees.','Skeleton: pull up beside → the first cut → the straighten → the second cut → the fix. One landmark per step.','Opening line: “Parking is three turns of the wheel at three landmarks. Learn the landmarks, forget the fear.”'] },
  { id:'w26', cat:'observe', topic:'Sit where you can see people for ten minutes. Pick one stranger and write what their day might be — built only from what you can actually see.', reader:'Yourself, later', hints:['Two lists first: what you SEE (evidence) and what you GUESS (inference). Keep the line visible while writing.','Skeleton: where you are → the person, in observable detail → what the details suggest → where the guess runs out.','Opening line: “From the shoes alone I had three theories. The bag settled it.”'] },
  { id:'w27', cat:'observe', topic:'Describe the room you are in to a blind reader. Sound, smell, texture, layout — sight is the garnish, not the meal.', reader:'A blind reader', hints:['Close your eyes for one minute first and take inventory of the other senses.','Skeleton: the sounds and their directions → the air → surfaces under hand → the geography, walked not seen.','Opening line: “The fan is the loudest thing here, and it sits above and to my right.”'] },
  { id:'w28', cat:'observe', topic:'Watch ten minutes of any sport and write only what the losing side did.', reader:'A coach', hints:['Attention discipline: every sentence about the losers. The winners appear only as weather.','Skeleton: their plan as far as you can read it → where it cracked → the one player fighting it → what they never tried.','Opening line: “Everyone watched the winners. I watched the other eleven.”'] }
];

const SPEAK_BANK = [
  { id:'s01', cat:'opinion', topic:'Should offices go back to five days a week? Take a side. Two minutes.', reader:'Your team, at lunch', cues:['Hinjewadi on a Monday','a fresher\'s first week','the empty Friday floor','a teammate\'s newborn','the whiteboard photo','45 minutes each way'], hints:['Pick the side you have actually lived, not the popular one.','PREP: your point in one sentence → the reason → one real example from your office → the point again.','First sentence out loud: “My answer is no — one specific kind of no, and here is the reason.”'] },
  { id:'s02', cat:'opinion', topic:'Better to be early and average, or late and excellent? Two minutes, one side.', reader:'A junior asking for advice', cues:['monsoon road resurfacing','a surgeon closing up','the demo shipped half-built','a wedding photographer\'s edit','a two-week extension','an exam hall bell'], hints:['Ground it in one deadline from your own work where this exact trade showed up.','PREP: point → reason → that deadline story in 30 seconds → point again.','First sentence: “I have shipped both ways, and only one of them let me sleep.”'] },
  { id:'s03', cat:'opinion', topic:'Your company gives every employee one free Friday a month for anything. Argue it pays for itself.', reader:'A skeptical CFO', cues:['twelve Fridays a year','one replacement hire\'s cost','3M\'s Post-it note','the release-week clash','the support rota','a tool nobody funded'], hints:['A CFO hears costs. Convert everything to what it saves or earns.','PREP: the claim in money terms → the mechanism → one concrete example → the claim again.','First sentence: “Twelve days a year sounds like a cost, so let me price what it replaces.”'] },
  { id:'s04', cat:'opinion', topic:'Movies in theatres vs at home — defend one properly. Two minutes.', reader:'Friends planning the weekend', cues:['a 400-rupee ticket','the interval samosa queue','a full house gasping','the pause button','a laptop speaker','the lit phone screen'], hints:['Sensory evidence wins this one: name what the room does that the other room cannot.','PREP: pick → the one irreplaceable thing → a specific film where it mattered → pick, restated.','First sentence: “I will pay four times the price for one reason, and it is not the screen.”'] },
  { id:'s05', cat:'opinion', topic:'Should schools teach personal finance instead of one existing subject? Which subject goes?', reader:'A school principal', cues:['a 40-minute period','the Class 9 timetable','trigonometry chapters','a first salary slip','a credit-card bill','one teacher\'s post'], hints:['The brave part is naming what gets cut. Name it and defend the cut.','PREP: the swap → why finance earns the slot → what the cut subject loses and why that is survivable → the swap again.','First sentence: “I am not adding a subject, I am trading one, and I know exactly which.”'] },
  { id:'s06', cat:'explain', topic:'Explain to a new teammate what your current project does and why the company funds it. Two minutes.', reader:'A new teammate, day one', cues:['the spreadsheet it replaced','one user\'s Monday morning','the first screen','who signs the invoice','the request that started it','one dashboard number'], hints:['They need the why before the what. Funding logic first, architecture never.','Shape: the problem it solves → what exists because of it → your part → what breaks if it stopped.','First sentence: “Before I show you any code, let me tell you why this team exists.”'] },
  { id:'s07', cat:'explain', topic:'Explain how an auto-rickshaw meter fare builds up, to a tourist who suspects they are being cheated.', reader:'A tourist', cues:['the first 1.5 km','the printed fare card','the meter dial','waiting at a signal','luggage charge per bag','night fare after midnight'], hints:['Their fear is the structure: answer “am I being cheated” head-on with the arithmetic.','Shape: the flag-down base → per-km → the legitimate extras → the one actual scam to watch for.','First sentence: “The meter is honest more often than you think — let me show you what it is counting.”'] },
  { id:'s08', cat:'explain', topic:'Teach the rules of any game you love in two minutes flat, to someone who will play in five.', reader:'A friend about to play', cues:['the board at setup','the winning board','how a turn ends','the one illegal move','a beginner\'s first mistake','the scoresheet'], hints:['They play in five minutes: teach only what the first game needs. Edge cases are for game two.','Shape: the goal → the turn (what you do when it is your go) → the one rule everyone breaks → done.','First sentence: “You only need three things to survive your first game, and here they are.”'] },
  { id:'s09', cat:'explain', topic:'Explain why the monsoon arrives in June, out loud, to a curious kid.', reader:'A 10-year-old', cues:['hot sand, cool sea','a heated tawa','Kerala, first of June','the Western Ghats','an open window draught','a kettle\'s steam'], hints:['Land heats faster than sea — the whole monsoon hangs on that one line.','Shape: summer cooks the land → hot air rises → the sea sends wet wind to fill the gap → mountains wring it out.','First sentence: “The monsoon is the sea noticing that the land got too hot.”'] },
  { id:'s10', cat:'explain', topic:'Your building’s lift is out for a month. Explain to the society WhatsApp group how repairs, costs and priorities will work — calmly.', reader:'Sixty annoyed neighbours', cues:['the fourth-floor grandmother','the sinking fund','three vendor quotes','an imported gearbox part','the AMC contract','gas cylinder deliveries'], hints:['Angry audiences need the timeline first, sympathy second, process third.','Shape: what happened in one line → the dates → who pays what → the one thing you need from them.','First sentence: “Four weeks, and I will tell you exactly where each of them goes.”'] },
  { id:'s11', cat:'story', topic:'Tell the story of the best goal, catch, or point you ever saw live — build to it, don’t open with it.', reader:'Friends at dinner', cues:['the floodlights coming on','the scoreboard at 1-0','the man beside you','roasted peanuts in paper','the noise, then silence','minute 78'], hints:['The story is the thirty seconds BEFORE the moment. Spend your time there.','Shape: set the scene → raise the stakes → slow down right before → the moment in one sentence → the noise after.','First sentence: “To understand the goal you need to know how bad the previous eighty minutes were.”'] },
  { id:'s12', cat:'story', topic:'Tell the story of a plan that went wrong but worked out anyway. Two minutes, real story.', reader:'Friends', cues:['the original itinerary','the wrong platform','a phone at 8%','the promised arrival time','the shopkeeper\'s landline','what you ate instead'], hints:['Two turns: where it broke, and where the break turned out to be the gift. Mark both clearly.','Shape: the plan → the break → the scramble → the accidental win → one dry closing line.','First sentence: “The plan was simple, which should have been the warning.”'] },
  { id:'s13', cat:'story', topic:'One street you know well — what it was, what it is, what it will be.', reader:'A visitor', cues:['the corner tea stall','the felled peepal tree','a new metro pillar','tailor turned cafe','the pothole everyone dodges','the old milk booth'], hints:['One street only. Past-present-future does the organizing for you.','Shape: the street ten years ago in three details → the same three spots today → the same three in ten years.','First sentence: “There is a street I have known for ten years, and it has been three different streets.”'] },
  { id:'s14', cat:'story', topic:'Retell the plot of the last film or series you finished — to someone deciding whether to watch. No spoilers past the midpoint.', reader:'A friend deciding', cues:['the first five minutes','eight episodes, 40 minutes','the lead actor\'s face','the midpoint turn','the scene you rewound','who it isn\'t for'], hints:['Whole first act in four sentences, then sell the question the midpoint asks.','Shape: the world → the person → the disruption → the question you leave them with.','First sentence: “I can tell you the first half, and if the first half does not sell you, skip it.”'] },
  { id:'s15', cat:'impromptu', topic:'A time machine gives you 24 hours anywhere in history before you were born — only to watch, not to change. Which day, and why that one?', reader:'A curious stranger', cues:['15 August 1947, Delhi','Panshet dam, July 1961','Wankhede, April 2011','Pompeii, the day before','an ordinary market day','mission control, 1969'], hints:['“Only to watch” is the constraint that makes it interesting. Honour it.','Shape: the day, named → why standing there beats reading about it → what you would actually look at → the one detail no book records.','First sentence: “Out of all of history I am spending my one day standing in a crowd, and I can defend that.”'] },
  { id:'s16', cat:'impromptu', topic:'Defend an unpopular opinion you genuinely hold about food. Two minutes, straight face.', reader:'A dinner table mid-argument', cues:['pineapple on pizza','coriander','reheated dal, day two','the 15-rupee vada pav','Maggi cooked soggy','the host\'s own recipe'], hints:['Genuinely hold it — mock opinions produce mock speeches. The defence should be sensory.','PREP still works: opinion → the real reason → the dish that proves it → opinion, doubled down.','First sentence: “I will say it slowly so nobody mishears.”'] },
  { id:'s17', cat:'impromptu', topic:'A genie grants your city one piece of infrastructure, built overnight. Make the pick and defend it against the obvious alternatives.', reader:'The city, somehow listening', cues:['Hinjewadi at 9am','PMPML depot','Karve Road storm drains','1.5-metre footpath','eight-year metro build','sabziwala\'s cart'], hints:['The defence is the speech: name the two runner-ups and beat them.','Shape: the pick → the daily pain it ends → runner-up one, dismissed → runner-up two, dismissed → the pick again.','First sentence: “One wish, and I am not spending it on the thing everyone shouts about.”'] },
  { id:'s18', cat:'impromptu', topic:'What makes a good teacher? Use exactly one teacher you actually had as the whole argument.', reader:'A room of new teachers', cues:['the back bench','notes in the margin','a 40-minute period','chalk on her sleeve','the doubt asked after class','the week before boards'], hints:['One teacher, three specific habits. The person is the structure.','Shape: the teacher in one image → habit one with a moment → habit two with a moment → what stayed with you.','First sentence: “I can define a good teacher in one word: her name.”'] },
  { id:'s19', cat:'impromptu', topic:'Two minutes with your father (or any elder) when they were 18 — but you can only ask questions, give no advice. What do you ask, and why those?', reader:'A friend who posed it', cues:['his first month\'s pay','the room he shared','the last bus home','one black-and-white photo','the friend he lost','a cinema ticket, 1985'], hints:['The constraint is the game: pick three questions that DO something advice cannot.','Shape: why questions beat advice, in one line → the three questions, each with its reason → which answer you’re most curious about.','First sentence: “I get three questions with a person who no longer quite exists, and I have chosen them carefully.”'] },
  { id:'s20', cat:'impromptu', topic:'Sell the most boring object within arm’s reach of you right now. Ninety seconds minimum, full commitment.', reader:'A shopping-channel camera', cues:['the stapler\'s jaw','a 15-rupee price tag','the desk drawer','one cable tie','the fan regulator dial','the last borrower'], hints:['Commitment is the exercise. Find the one genuinely good thing about the object and inflate nothing else.','Shape: the problem you invent → the object as its answer → the demonstration → the offer.','First sentence: “You have lived your whole life underestimating this, and today that ends.”'] }
];

const WRITE_TOPICS_NEW = [
  { id:'w29', cat:'explain', topic:'Explain to a cousin building a house why cement needs water to harden — and why the walls keep getting stronger for weeks afterwards.', reader:'A cousin mid-construction', hints:['Curing is a slow chemical handshake, not drying — the water is an ingredient, not a nuisance.','Skeleton: what people assume (it dries) → what actually happens (it reacts) → why the daily watering ritual matters → what a rushed wall costs later.','Opening line: “Cement does not dry. It feeds — and water is the meal.”'] },
  { id:'w30', cat:'explain', topic:'Explain to a kid on a train where the clickety-clack comes from — and why the rails need gaps at all.', reader:'A kid at the window', hints:['Metal grows in the heat; the gap is the rail’s breathing room, and the click is the wheel crossing it.','Skeleton: the sound → the gap that makes it → why summer needs the gap → why newer welded tracks are quieter.','Opening line: “That sound you are tapping your foot to is the train counting its own track.”'] },
  { id:'w31', cat:'explain', topic:'Explain to a football-mad friend why a cricket ball swings in the air — and why the bowler keeps polishing one side on his trousers.', reader:'A friend who only watches football', hints:['One shiny side, one rough side — the air treats them differently, and the ball leans into the difference.','Skeleton: the polishing ritual → smooth air versus messy air → the lean that becomes swing → why an old ball behaves differently from a new one.','Opening line: “The red stain on the bowler’s trousers is the whole trick.”'] },
  { id:'w32', cat:'explain', topic:'Explain to your grandmother how an ATM decides, in three seconds, that the card in the slot is really hers.', reader:'Grandmother', hints:['It is a phone call, not a judgement — the machine asks her bank and the bank answers.','Skeleton: the card is a name tag → the PIN is the password only she and the bank share → the call to the bank → the yes that releases the cash.','Opening line: “The ATM does not know you. It knows someone who does.”'] },
  { id:'w33', cat:'explain', topic:'Explain to a friend why the same note sounds like a flute on a flute and a guitar on a guitar.', reader:'A friend learning music', hints:['The main note is identical; the flavour is the crowd of quieter notes riding on top of it.','Skeleton: what “same note” means → the hidden extra tones every instrument adds → how each instrument mixes its own recipe → why a human voice is the richest of all.','Opening line: “Two instruments playing the same note are two cooks using the same main ingredient.”'] },
  { id:'w34', cat:'explain', topic:'Explain to your flatmate why onions make you cry — and why the chilled one from the fridge stings less.', reader:'A flatmate mid-chop', hints:['The onion is defending itself: the knife breaks cells, the cells release a gas, the gas finds your eyes.','Skeleton: the cut → the gas → what the eye does in response → why cold slows the whole ambush down.','Opening line: “The onion is not innocent. It is firing back.”'] },
  { id:'w35', cat:'explain', topic:'Explain to a new tenant how water reaches their fourth-floor tap — the sump, the pump, the overhead tank, and why the timings exist.', reader:'A tenant who just moved in', hints:['Follow one bucket of water from the road to the tap; the building is just a relay race.','Skeleton: the underground sump → the pump’s scheduled lift → the tank on the roof → gravity runs the last leg → why 7am matters.','Opening line: “Your tap does not have pressure. Your roof does.”'] },
  { id:'w36', cat:'explain', topic:'Explain to a kid why thunder arrives after the lightning it belongs to.', reader:'A kid counting the gap', hints:['Light and sound leave together; one is simply a much faster runner.','Skeleton: one event, two messengers → the fast one and the slow one → what counting the seconds tells you → the strike that is “right overhead”.','Opening line: “Lightning and thunder are twins that never arrive together.”'] },
  { id:'w37', cat:'explain', topic:'Explain to a friend buying a used bike why it lost half its value in three years while still running perfectly.', reader:'A friend at a resale showroom', hints:['Price is not condition — it is the queue of unknowns the next owner must accept.','Skeleton: what the first owner paid for (newness, warranty, certainty) → what survives resale → why the drop is steepest early → how to use all this as the buyer.','Opening line: “The bike did not lose value. The certainty around it did.”'] },
  { id:'w38', cat:'explain', topic:'Explain to a foreign colleague why Hindi and Marathi share a script but are different languages — what a script actually is.', reader:'A colleague visiting Pune', hints:['A script is clothing, a language is the body — the same clothes can dress two different people.','Skeleton: what the letters do → what the words do → one line that reads alike and means differently → why a speaker can read aloud without understanding.','Opening line: “I can read a newspaper aloud in a language I only half understand, and that fact is the whole lesson.”'] },
  { id:'w39', cat:'explain', topic:'Explain to a new rider what the clutch actually does — why the bike stalls without it and glides with it.', reader:'A friend learning to ride', hints:['The clutch is a handshake between a spinning engine and a stopped wheel; squeeze means “let go”, release means “grip”.','Skeleton: the engine never stops spinning → the wheel must start from zero → the clutch lets them meet gently → a stall is a rushed introduction.','Opening line: “The engine and the wheel do not speak the same speed. The clutch is the interpreter.”'] },
  { id:'w40', cat:'explain', topic:'Explain to a kid how ants find the sugar you spilled and build a perfect marching line to it within the hour.', reader:'A kid watching the line', hints:['No ant knows the plan — each one leaves a scent trail, and good trails get busier.','Skeleton: the wandering scout → the scent breadcrumb → followers strengthen the trail → why the line straightens itself over time.','Opening line: “Nobody is in charge of that line, and that is the amazing part.”'] },
  { id:'w41', cat:'narrate', topic:'Write the first hour of your nearest vegetable market setting up — for a reader who has only ever seen it at noon.', reader:'A late riser', hints:['The order of arrival is the story: who comes first, what gets built, when the first customer appears.','Skeleton: the empty street → the first handcarts → the stacking and arranging → the first sale of the day.','Opening line: “By the time you see the market, it has already had a whole morning you missed.”'] },
  { id:'w42', cat:'narrate', topic:'Narrate one heavy downpour over your street, minute by minute — the five minutes before, the burst, and the after.', reader:'A friend in a dry city', hints:['The “before” carries the tension: the light, the wind, the birds, the first smell. Spend real time there.','Skeleton: the warning signs → the first fat drops → the full roar → what the street looks like when it stops.','Opening line: “The rain announced itself twice before it arrived.”'] },
  { id:'w43', cat:'narrate', topic:'Narrate a wedding you attended from the caterers’ side of the counter — their evening, not the couple’s.', reader:'A friend who loves weddings', hints:['Attention discipline: the guests are background weather; the serving line is the plot.','Skeleton: the setup hours → the first rush → the crisis moment every buffet has → the teardown after the guests leave.','Opening line: “Everyone watched the stage. The real performance was behind the dal counter.”'] },
  { id:'w44', cat:'narrate', topic:'Narrate the final minutes of any close game that was not football — a cricket chase, a badminton decider, a kabaddi raid — for a friend who only follows football.', reader:'A football-only friend', hints:['Translate the tension into stakes they already know: what a “last over” is in football terms.','Skeleton: the situation in one line → what each side needed → the two moments it swung → the final act.','Opening line: “You know what a 90th-minute corner feels like. Now stretch that feeling across six balls.”'] },
  { id:'w45', cat:'narrate', topic:'Tell the story of one object in your family home older than you — where it has been, as far as anyone knows. Gaps allowed.', reader:'A cousin who never asked', hints:['Honest gaps beat invented history: say what is known, and mark what is guessed.','Skeleton: the object today → its earliest known chapter → the journey between → the gap nobody can fill.','Opening line: “There is a thing in our house that has outlived three addresses and everyone’s memory of buying it.”'] },
  { id:'w46', cat:'narrate', topic:'Narrate the first thirty minutes of an evening power cut in your building — what people actually did.', reader:'A reader who has never had one', hints:['The building becomes audible: doors open, voices carry, the corridor fills. Follow the sound.','Skeleton: the instant of the cut → the first reactions through the walls → the corridor gathering → the small society that forms by torchlight.','Opening line: “The lights went, and the building immediately got louder.”'] },
  { id:'w47', cat:'narrate', topic:'Narrate one visit to your barber shop — the queue, the talk, the ritual — for a reader who has never been inside an Indian salon.', reader:'A reader abroad', hints:['The dialogue is the furniture: what gets discussed, in what order, with whom.','Skeleton: entering and reading the queue → the chair and the opening negotiation → the talk of the shop that day → the mirror moment at the end.','Opening line: “The haircut takes twenty minutes. The visit takes an hour, and the difference is the point.”'] },
  { id:'w48', cat:'narrate', topic:'Narrate five minutes on a big junction platform as a long-distance train pulls in.', reader:'A reader who has never seen an Indian station', hints:['Two currents collide — those getting off and those getting on — and everything else orbits that.','Skeleton: the platform waiting → the announcement and the surge → the doors → the sellers working the windows → the platform after.','Opening line: “A train does not arrive at a junction. It detonates, gently, for five minutes.”'] },
  { id:'w49', cat:'argue', topic:'Argue to a fintech friend that cash must stay alive even as UPI wins — and answer his best point, that cash hides tax evasion.', reader:'A friend who works in fintech', hints:['Argue from the days the network fails and the people it never reached, not from nostalgia.','Skeleton: the claim → who cash still serves, concretely → his evasion point, stated fairly → why the answer is “both”, not “either”.','Opening line: “The day the payment app went down, one shop on my street kept selling, and that shop is my argument.”'] },
  { id:'w50', cat:'argue', topic:'Argue to a builder friend that the old houses of the city’s core are worth keeping even when the plot is worth more than the walls — and answer the housing-shortage objection honestly.', reader:'A friend in construction', hints:['Pick one actual building you have walked past and argue from it, not from “heritage” in the abstract.','Skeleton: the building → what is lost that money cannot rebuild → his objection (people need homes), given full weight → the narrower rule you would actually defend.','Opening line: “There is a house I pass every week that is worth more demolished, and I want to argue it should stand anyway.”'] },
  { id:'w51', cat:'argue', topic:'Argue one side: the society WhatsApp group does more harm than good. Address the strongest counter — it is the only channel that reaches everyone.', reader:'The society secretary', hints:['Count real messages from one week: how much was signal? Argue from the count.','Skeleton: the position → one week of evidence → the counter, stated at full strength → your fix or your surrender.','Opening line: “I read every message our group sent last week, and I have a count to share.”'] },
  { id:'w52', cat:'argue', topic:'Penalty shootouts: fair test or lottery? Take a side against a friend who holds the other one, and steelman him first.', reader:'A friend after a final', hints:['Whichever side you take, name the best match evidence for the other side before your own.','Skeleton: his case, honestly → your case → the one shootout that proves your point → what you would replace or keep.','Opening line: “Before I tell you why you are wrong, let me make your argument better than you did.”'] },
  { id:'w53', cat:'argue', topic:'Argue to a hiring manager that the college name on a CV should be ignored after the first job — and answer her point that the name is a time-saving filter.', reader:'A hiring manager', hints:['Her objection is efficiency, not snobbery — answer the efficiency, or lose.','Skeleton: the claim → what the name actually predicts after year one → her filter argument, priced honestly → the cheaper filter you propose instead.','Opening line: “The college name answers one question well, and it is not the question you are hiring for.”'] },
  { id:'w54', cat:'argue', topic:'Argue for or against making the city’s buses free — to a councillor who will ask, first thing, who pays.', reader:'A city councillor', hints:['“Who pays” is not an attack, it is the whole question — open your answer with it.','Skeleton: the proposal → the fare money, sized roughly and out loud → what free buses buy the city → the overcrowding objection, answered or conceded.','Opening line: “The fares cover less of the bill than you think, so let me start with the money.”'] },
  { id:'w55', cat:'argue', topic:'The IPL auction — good for cricket or bad for it? Take one side to an uncle who holds the other, and grant his best point first.', reader:'An uncle who watches every season', hints:['Argue about the sport, not just the money: what the auction does to how teams and careers get built.','Skeleton: his side, fairly → your side → one player’s career as the evidence → the change you would make if you could.','Opening line: “You and I watched the same auction and saw two different sports.”'] },
  { id:'w56', cat:'argue', topic:'Argue to a school principal that handwriting still deserves classroom hours in the laptop era — against the objection that typing is the real-world skill.', reader:'A school principal', hints:['Do not argue tradition; argue what the slow pace of a pen does that a keyboard does not.','Skeleton: the objection, stated fairly → what handwriting trains besides writing → the evidence you have seen → the modest allocation you would actually ask for.','Opening line: “I am not here to defend cursive. I am here to defend slowness.”'] },
  { id:'w57', cat:'argue', topic:'Argue that every appliance should be repairable by law — to a product manager whose counter is that repairability makes devices bulkier and costlier.', reader:'A product manager at an appliance company', hints:['Argue from one dead appliance you have seen thrown away over a part worth fifty rupees.','Skeleton: the dead appliance → the rule you propose → her bulk-and-cost objection, given real weight → where you would draw the line.','Opening line: “A machine of mine died last year over a part the size of a coin, and I want to talk about whose fault that is.”'] },
  { id:'w58', cat:'argue', topic:'Should cities keep zoos? Take a side to a parent who takes their kids every year — and steelman the education argument before you touch it.', reader:'A parent of two', hints:['The strongest case for zoos is a child seeing a real animal; handle that case with respect, whichever side you take.','Skeleton: the parent’s case at full strength → your position → the evidence from one zoo visit you remember → what you would build or keep instead.','Opening line: “The best argument against my position is a six-year-old at the tiger enclosure, so I will start there.”'] },
  { id:'w59', cat:'argue', topic:'Argue to a shop owner who wants the food carts cleared that the carts outside deserve licensed, permanent spots — and answer the pavement and hygiene objections.', reader:'A shop owner on the same street', hints:['His objections are real; the argument is that licensing fixes what clearing only relocates.','Skeleton: his complaints, listed fairly → what the carts add to the street’s economy → why a licence answers each complaint better than eviction → the shared win.','Opening line: “You want the carts gone. I want them numbered, and I think my version solves your problem better.”'] },
  { id:'w60', cat:'argue', topic:'A friend says watching sport is a waste of time — three hours, nothing produced. Defend the watching, on paper, without using the word “passion”.', reader:'A friend who optimizes everything', hints:['His frame is production; either break the frame or beat it inside its own rules.','Skeleton: his argument, stated better than he said it → your counter-frame → one match that did something a productive evening could not → the concession you are willing to make.','Opening line: “You are right that nothing is produced, and that is the first thing I want to defend.”'] },
  { id:'w61', cat:'argue', topic:'Argue for or against engineering colleges allowing AI assistants in assignments — to a professor whose objection is that students will learn nothing.', reader:'An engineering professor', hints:['Her fear is real; argue about what the assignment should now measure, not about whether the tools exist.','Skeleton: the professor’s objection, in full → what assignments measured before → what they could measure now → the exam-day line you would draw.','Opening line: “The tool is already in every hostel. The only question left is what the assignment is for.”'] },
  { id:'w62', cat:'argue', topic:'A friend says the metro came too late to change how your city moves. Agree or disagree in one page, with the counter-case granted first.', reader:'A friend stuck in traffic', hints:['Argue from one route and one kind of commuter, not from the whole city at once.','Skeleton: his “too late” case, made properly → your position → the one route that decides it → what would have to be true in five years for you to be wrong.','Opening line: “Pick one road at 9am and I will make the whole argument on it.”'] },
  { id:'w63', cat:'process', topic:'Write the packing method for a one-day trek so a first-timer’s bag is light, balanced, and nothing digs into their back.', reader:'A first-time trekker', hints:['Order by layer: what goes in first lives at the bottom, and the reason is the spine of the piece.','Skeleton: the bag choice → the heavy-close-and-low rule → the water and food layer → the top pocket’s three items → the final shoulder-shake test.','Opening line: “A bag packed in the right order carries itself.”'] },
  { id:'w64', cat:'process', topic:'Write the process for getting a real resolution out of customer care — steps, scripts, and when to escalate.', reader:'A friend on hold right now', hints:['The system responds to records, not anger: every step should leave a written trace.','Skeleton: prepare the three facts → the first-call script → the reference-number ritual → the escalation ladder → when to stop calling and start writing.','Opening line: “Customer care is a machine that runs on reference numbers, and I will show you how to feed it.”'] },
  { id:'w65', cat:'process', topic:'Write the method for buying vegetables at a mandi — picking, checking, bargaining — for someone who has only shopped in supermarkets.', reader:'A supermarket-only friend', hints:['The supermarket does three jobs for them silently; name the jobs, then teach each one.','Skeleton: the walk-through-first rule → how to check three common vegetables by hand → the price question → when bargaining is expected and when it is rude.','Opening line: “In a supermarket the shop has done your checking for you. Here, the checking is yours, and it takes two minutes to learn.”'] },
  { id:'w66', cat:'process', topic:'Write the setup steps for a parent’s new phone so they never get locked out — accounts, PINs, and the one paper backup.', reader:'A friend doing this on Sunday', hints:['Design for the bad day: every step exists so a forgotten password is a five-minute fix, not a crisis.','Skeleton: the one account that rules the phone → where each PIN gets written, on paper → the recovery contact → the test lockout you run on purpose before leaving.','Opening line: “Set the phone up for the day the password is forgotten, because that day is coming.”'] },
  { id:'w67', cat:'process', topic:'Write instructions for ironing a shirt properly in five passes — for a hosteller who has always paid the press-wala.', reader:'A hosteller', hints:['Order is the whole skill: collar, cuffs, sleeves, back, front — and why that order avoids re-wrinkling what you just did.','Skeleton: the setup (heat, surface, slightly damp) → the five passes in order → the two spots everyone scorches → the hanging rule.','Opening line: “The press-wala’s secret is not the iron. It is the order.”'] },
  { id:'w68', cat:'process', topic:'Write what a driver should actually do when an ambulance appears behind them in dense traffic — the moves, in order, for a new driver.', reader:'A new driver', hints:['Panic is the enemy; the process is three calm moves anyone can make from any lane.','Skeleton: hear it early (the mirror habit) → the signal to the cars around you → the edge-and-stop move, lane by lane → the one thing never to do (follow it through the gap).','Opening line: “The siren is not asking you to hurry. It is asking you to be predictable.”'] },
  { id:'w69', cat:'process', topic:'Write the method for splitting a group dinner bill without an argument — including the two classic disputes and how to settle each.', reader:'The friend who always ends up doing it', hints:['Decide the rules before the food arrives, not after the bill — that is the whole trick.','Skeleton: the upfront announcement → equal-split versus itemized, chosen out loud → dispute one (the non-drinker) → dispute two (the late arriver) → the settle-tonight rule.','Opening line: “Every bill fight starts at the end of dinner. Move the decision to the start and the fight disappears.”'] },
  { id:'w70', cat:'observe', topic:'Watch the sky for ten minutes when rain is coming and write only what changes — light, wind, birds, sound.', reader:'A reader indoors', hints:['Verbs of change only: darkens, drops, scatters. If it stayed the same, it does not get a sentence.','Skeleton: the sky at minute zero → the first change → the cascade → the last still moment before the first drop.','Opening line: “The rain sent four messengers ahead of it, and I wrote down their order.”'] },
  { id:'w71', cat:'observe', topic:'Spend ten minutes at a tea stall and write the economics you can actually see — who buys, what sells, what the rush is.', reader:'A friend studying economics', hints:['Count things: cups, customers, minutes per transaction. The numbers are the observation.','Skeleton: the stall’s layout as a machine → the customer types, sorted by what they order → the rhythm of the rush → the one item that never sells and why it is still stocked.','Opening line: “In ten minutes the stall did more transactions than my bank branch does in an hour.”'] },
  { id:'w72', cat:'observe', topic:'Watch one crow or pigeon for ten minutes and write only what it actually does — no guessing at what it wants.', reader:'A kid who asked what birds do all day', hints:['Every time you write “it wants” or “it is looking for”, strike it and write the visible action instead.','Skeleton: where it starts → each move, in order → its dealings with other birds → where the ten minutes leave it.','Opening line: “I watched one crow for ten minutes and it did eleven things, none of which I would have guessed.”'] },
  { id:'w73', cat:'observe', topic:'Sit with eyes closed for five minutes and write your street as a sound map — each sound placed by distance and direction.', reader:'A film sound designer', hints:['Order by distance: the sounds touching the window first, the city hum last.','Skeleton: the nearest layer → the middle distance → the far wash → the one sound that moved through all three.','Opening line: “With my eyes closed, my street is about forty metres deep.”'] },
  { id:'w74', cat:'observe', topic:'In a café or canteen, watch only people’s hands for ten minutes and write what the hands are doing — not the faces, not the talk.', reader:'A novelist collecting details', hints:['The constraint is the exercise: any sentence about a face is a miss; hands only.','Skeleton: the working hands → the idle hands → the hands that talk → the pair of hands that told the clearest story.','Opening line: “Faces perform. Hands just work, and for ten minutes I watched only the workers.”'] },
  { id:'w75', cat:'observe', topic:'Watch someone skilled run their machine — the press-wala’s iron, the juice machine, the key-cutter — and write exactly how they work it.', reader:'An apprentice on day one', hints:['The skill hides in the small moves: the wrist, the pauses, what they check without looking.','Skeleton: the machine at rest → the setup moves → the working rhythm → the checks they do that a beginner would skip.','Opening line: “The machine has two operators: the obvious one, and the habits inside his hands.”'] },
  { id:'w76', cat:'letter', topic:'Write to your landlord about the wall that seeps every rainy season — the evidence, the cost of waiting, and one specific ask with a date.', reader:'The landlord', hints:['He has heard “there is seepage” before; give him what he has not heard — dates, photos referenced, and a number.','Skeleton: the fact pattern, dated → what waiting costs him, not you → the specific repair and the specific date → the polite consequence if not.','Opening line: “I am writing this in July so that we are not arguing about it in September.”'] },
  { id:'w77', cat:'letter', topic:'Write to the ward office about one specific broken footpath stretch — describe it exactly, propose the fix, and answer the no-budget reply in advance.', reader:'The ward officer', hints:['Precision is the persuasion: metres, landmarks, and who trips there daily beat adjectives every time.','Skeleton: the stretch, located exactly → who it fails, observed → the modest fix → the budget objection, pre-answered with a cheaper interim step.','Opening line: “This letter is about forty metres of footpath, and I can name both ends.”'] },
  { id:'w78', cat:'letter', topic:'Write to a newspaper’s sports editor making the case for one weekly column on local leagues — and answer the objection that nobody reads local sport.', reader:'The sports editor', hints:['Editors buy readers, not virtue: your argument must be about who would read it, not who deserves coverage.','Skeleton: what the paper covers now → the readers it is leaving on the table → the nobody-reads-it objection, answered with one local match crowd → the pilot you propose.','Opening line: “Last Sunday, four hundred people watched a match your paper does not know happened.”'] },
  { id:'w79', cat:'letter', topic:'Write to the society secretary proposing marked two-wheeler parking rules — with the oldest residents’ claimed-spot objection answered before they raise it.', reader:'The society secretary', hints:['The claimed spots are the real issue; propose rules that give the old-timers something, not nothing.','Skeleton: the current mess, described without blame → the proposed markings and rules → the claimed-spots objection, met with a grandfather clause → the vote you are requesting.','Opening line: “I have a proposal that takes nothing from anyone who already parks well.”'] },
  { id:'w80', cat:'letter', topic:'Write to the bus depot manager praising one specific conductor or driver for one specific thing you saw — and ask that the practice spread.', reader:'The depot manager', hints:['Praise persuades when it is exact: route, time, what they did, what it changed for the passengers.','Skeleton: the incident, with route and time → what the person did, precisely → why it mattered on that bus → the ask: name it, teach it, repeat it.','Opening line: “Complaint letters reach you daily, so here is the other kind, with a route number attached.”'] }
];

const SPEAK_TOPICS_NEW = [
  { id:'s21', cat:'opinion', topic:'Trains or flights for any trip under twelve hours — take a side. Two minutes.', reader:'A friend booking travel tonight', cues:['Pune–Nagpur by rail','tatkal at 10am','a 1,200-rupee berth','the cab to Lohegaon','55 minutes airborne','the pantry car'], hints:['Count the whole journey, door to door — the airport eats hours that never show on the ticket.','PREP: pick → the door-to-door arithmetic → one real trip as evidence → pick again.','First sentence: “The flight is two hours long and the flying day is nine, so let me do the honest math out loud.”'] },
  { id:'s22', cat:'opinion', topic:'Should tipping be replaced by a flat service charge? One side, two minutes, and grant the best point of the other.', reader:'A restaurant-manager friend', cues:['the 10% bill line','a 50-rupee note','the kitchen staff','one waiter, six tables','Sunday lunch rush','the tip jar'], hints:['The other side’s best point is that tips reward good service — say it before they do, then answer it.','PREP: position → the reason → the tips-reward-service point, answered → position again.','First sentence: “I want to defend the boring option, and I will start by admitting what it loses.”'] },
  { id:'s23', cat:'opinion', topic:'Cash pocket money or UPI for a school kid — which teaches money better? Take a side for a parent who asked.', reader:'A parent deciding this week', cues:['a folded 100 note','the canteen counter','a 20-rupee samosa','forty UPI lines','change in toffees','pocket money on Monday'], hints:['Argue about what the kid learns, not what is convenient — the friction might be the feature.','PREP: pick → what each option teaches → one concrete kid-and-shop scenario → pick again.','First sentence: “The question is not which is convenient — it is which one lets the kid feel ten rupees leave.”'] },
  { id:'s24', cat:'opinion', topic:'Are highlight reels ruining sport, or saving it? One side, against a friend who only watches highlights.', reader:'A highlights-only friend', cues:['the maiden over','a goalless first half','a 30-second clip','fielders creeping in','the collapse after tea','a rain-break commentator'], hints:['Steelman him first: nobody has five hours, and he still loves the game.','PREP: position → what highlights keep and what they delete → one match where the deleted part was the point → position again.','First sentence: “You saw every goal from last night and missed the entire match, and I mean that precisely.”'] },
  { id:'s25', cat:'opinion', topic:'Should the society allow feeding street dogs at the gate? Take a side, and state the other side’s strongest fear fairly first.', reader:'The society meeting', cues:['the gate at 9pm','a steel bowl','the cycling ten-year-old','four dogs, one litter','the sterilisation van','the watchman\'s chair'], hints:['Both sides are protecting something real — kids’ safety, animals’ welfare; name both before choosing.','PREP: the two fears, fairly → your position → the rule or compromise that answers the losing fear → position again.','First sentence: “Both sides of this argument are trying to protect someone, so let me name who first.”'] },
  { id:'s26', cat:'opinion', topic:'Music while working: does it help or hurt? One side, to a teammate who codes in headphones all day.', reader:'A headphones-all-day teammate', cues:['a lyric-free playlist','the floor at 3pm','a 40-minute debug block','one shoulder tap','the same album, looped','a question asked twice'], hints:['Split the work first — some tasks share the brain’s language channel with lyrics, some do not.','PREP: position → the task-type distinction → one honest example of each from any workday → position, refined.','First sentence: “My answer is yes and no, and the border between them is whether the work uses words.”'] },
  { id:'s27', cat:'opinion', topic:'Buy an electric two-wheeler now, or wait a generation? Advise a friend, and answer the battery-replacement worry head-on.', reader:'A friend at the showroom', cues:['80 km per charge','a 40,000-rupee battery','petrol at 106','the basement charging point','the lane mechanic','eight years of Activa'], hints:['His real fear is the battery bill in year four — put a number-shaped answer on it, even a rough one.','PREP: recommendation → the running-cost logic → the battery objection, faced directly → recommendation, with the condition that flips it.','First sentence: “I will give you a straight answer, and then the one condition under which it reverses.”'] },
  { id:'s28', cat:'opinion', topic:'“Old songs were simply better.” Real claim or pure nostalgia? Take a side against an uncle who is certain.', reader:'An uncle at a family dinner', cues:['a lyric everyone knows','the flops of 1975','one surviving cassette','antakshari after dinner','a 15-second reel hook','the Wednesday radio countdown'], hints:['Steelman nostalgia: we remember the hits and forget the forgettable — survivorship does half his arguing for him.','PREP: position → the survivorship point, put fairly → one old song and one new song compared on the same quality → position again.','First sentence: “The old songs you love beat the new ones — but they also beat most old songs, and that is my whole case.”'] },
  { id:'s29', cat:'opinion', topic:'Monuments charging foreigners more than Indians — fair or not? One side, to a visiting colleague who just paid twenty times your ticket.', reader:'A visiting foreign colleague', cues:['40 rupees, 800 rupees','the two queues','sixty schoolchildren','the Louvre\'s flat price','stone needing repointing','Shaniwar Wada, Sunday'], hints:['The strongest defence is who paid for the upkeep for decades; the strongest attack is the welcome it signals. Weigh both, then pick.','PREP: position → the taxpayer argument versus the welcome argument → what the ticket difference actually funds → position again.','First sentence: “You paid twenty times my price at the gate today, and I have decided whether that was fair.”'] },
  { id:'s30', cat:'opinion', topic:'Is a big wedding worth the money? Take one side for a cousin who is planning theirs, and grant the family-duty point properly.', reader:'A cousin mid-planning', cues:['a 600-name guest list','the aunt who\'d notice','eight lakh, one lawn','the mandap at 6am','twenty-two buffet counters','the photographer\'s long day'], hints:['This is not about the couple’s taste — argue the economics and the memory value like an honest accountant.','PREP: position → the cost, stated plainly → the family-and-memory counterpoint, honoured → the version of the wedding your side implies.','First sentence: “I costed a wedding this week, and I want to tell you what the biggest line item actually buys.”'] },
  { id:'s31', cat:'opinion', topic:'One more sport should be standard in every school PE period — name it and defend it against the default two, cricket and football.', reader:'A PE teacher', cues:['a 35-minute PE period','eleven playing, forty watching','one cemented court','the equipment cupboard','the football markings','a chalk kabaddi circle'], hints:['Your sport must beat the defaults on something schools care about: space, cost, or how many kids play at once.','PREP: the pick → the space-cost-participation case → why cricket and football keep losing on that exact axis → the pick again.','First sentence: “My sport needs no ground, no gear worth stealing, and nobody sits out — and it is not either of the two you are thinking of.”'] },
  { id:'s32', cat:'opinion', topic:'Should Indian sport be broadcast with Hindi or Marathi commentary as the default instead of English? One side, two minutes.', reader:'A sports channel producer', cues:['the SAP button','the stand chanting Marathi','\'chauka\', not \'four\'','the English-feed advertisers','grandmother, sound off','\'reverse swing\' in Marathi'], hints:['Argue from who is watching and what commentary is for — company, not translation.','PREP: position → who the audience actually is → one moment of commentary that landed because of its language → position again.','First sentence: “Commentary is not information, it is company, and company speaks your language.”'] },
  { id:'s33', cat:'opinion', topic:'“Pune’s weather is overrated.” Attack or defend, to a Mumbai friend who brought it up — and steelman the sea breeze before you dismiss it.', reader:'A Mumbai friend', cues:['Marine Drive, 7pm','Hadapsar, 40° in May','January fog, Sinhagad road','the March electricity bill','laundry drying in August','a three-week monsoon break'], hints:['Weather arguments are really arguments about two or three specific months — name yours.','PREP: position → the months that decide it → the Mumbai counter, granted its due → position again.','First sentence: “I will defend this city’s weather with a calendar, not with feelings.”'] },
  { id:'s34', cat:'explain', topic:'Explain to a curious kid what ore is and why finding metal in the ground is genuinely hard.', reader:'A 10-year-old', cues:['a steel spoon','a rusty nail','peanuts in chikki','red hillside soil','sieving stones from rice','a truckload per ring'], hints:['Start from the kitchen: the steel spoon was once dirt, and the story is how anyone knew which dirt.','Shape: metal hides mixed into rock → most rock has almost none → the hunt for the rich patch → why the hunting is the expensive part.','First sentence: “Every spoon in your kitchen started as a guess about which hill to dig.”'] },
  { id:'s35', cat:'explain', topic:'Explain why a borewell finds water in one plot and comes up dry next door — to a neighbour who just paid for a dry one.', reader:'A neighbour', cues:['cracks in basalt','a sponge, a plate','the old dug well','260 feet, dry','the coconut diviner','rain off tar road'], hints:['Underground water lives in the gaps of rock, and the gaps are not evenly spread — that is the whole story.','Shape: where the water sits (gaps, not lakes) → why the gaps vary metre to metre → what the drillers are betting on → why next door tells you less than it should.','First sentence: “There is no lake under the plot. There is a sponge, and sponges are patchy.”'] },
  { id:'s36', cat:'explain', topic:'Explain inflation using the price of one vada pav across ten years — to a teenager who just noticed the price.', reader:'A teenager', cues:['₹10 in 2015','₹25 this week','the college-gate cart','a 15-litre oil tin','the stall\'s rent','the same ₹100 note'], hints:['One item, one decade — never say “economy”; let the vada pav do all the work.','Shape: the price then and now → where the extra rupees went (each ingredient and each pair of hands) → why a small rise is normal → what it means for money kept under the mattress.','First sentence: “This vada pav has doubled in price without getting any bigger, and the reasons are hiding in plain sight.”'] },
  { id:'s37', cat:'explain', topic:'Explain to your father how noise-cancelling headphones remove the drone of a bus but not the conductor’s voice.', reader:'Dad', cues:['the bus engine drone','the conductor\'s shout','the ceiling fan hum','ripples in a bucket','the earcup mic','foam earplugs'], hints:['The headphone fights sound with opposite sound — and it can only fight what it can predict.','Shape: sound is a wave → the little mic hears it first → the anti-wave cancels it → why steady drones lose and sudden voices survive.','First sentence: “These headphones do not block noise. They argue with it, and they only win the arguments they can predict.”'] },
  { id:'s38', cat:'explain', topic:'Explain to a kid on a beach why the sea is salty when every river pouring into it is sweet.', reader:'A kid mid-swim', cues:['salt on your arm','a puddle\'s white ring','salt pans, train line','rocks the river scrapes','a million years','a pan boiling dry'], hints:['The rivers bring tiny amounts of salt; the sun takes only the water back — the salt has no exit.','Shape: rivers wash a pinch of salt off the land → the sea collects it for millions of years → the sun lifts water, never salt → a one-way door.','First sentence: “The sea is a pot that has been boiling for a very long time, and nobody ever washed it.”'] },
  { id:'s39', cat:'explain', topic:'Explain to a foreign colleague how the strip of dirt in the middle decides a cricket match — what a groundsman actually controls.', reader:'A colleague new to cricket', cues:['22 yards of clay','the heavy roller','grass at 4mm','cracks by day four','the bowler\'s footmarks','covers on at 4pm'], hints:['The pitch is a third team: grass, cracks, and moisture each change what the ball does.','Shape: what the ball does off the surface → grass versus bare versus cracked → how the pitch ages over five days → why captains stare at it before choosing.','First sentence: “Before either captain picks a team, both of them go and stare at the dirt — and they are right to.”'] },
  { id:'s40', cat:'explain', topic:'Explain to an angry aunt why the cab app doubles the fare the moment it rains.', reader:'An aunt in the rain', cues:['₹180 becomes ₹360','eleven riders, two cabs','6:40pm, rain starts','the auto stand opposite','the driver\'s engine off','the map turning orange'], hints:['Her question is moral (“is this cheating?”); answer the mechanism first, then judge it honestly.','Shape: more riders, same cars → the price as a rationing tool → who the high price is meant to summon → your own verdict, either way.','First sentence: “The app is not punishing you for the rain — it is bribing drivers to come out in it. Whether that is fair is the second half.”'] },
  { id:'s41', cat:'explain', topic:'Explain why your grandmother’s old house stays cool at noon while your new flat bakes — to the flatmate fanning himself.', reader:'A flatmate in summer', cues:['two-foot stone walls','the inner courtyard','small high windows','west-facing glass balcony','Mangalore tiles, loft above','the terrace slab, 3pm'], hints:['Thick walls are a thermos, high ceilings give heat somewhere to go, and the courtyard is a chimney.','Shape: thick walls buy hours → high ceilings park the heat overhead → cross-breeze and courtyards move it out → what new flats traded away and why.','First sentence: “That house was air-conditioned in 1950. The machine was the walls.”'] },
  { id:'s42', cat:'explain', topic:'Explain why a live concert sounds different from the same song’s recording — to a friend who says they will just stream it.', reader:'A friend skipping the show', cues:['bass in your chest','the speaker stack','3,000 people singing','an eight-minute version','a string gone flat','earphones on the bus'], hints:['The room, the crowd, and the imperfections are all instruments the recording deletes.','Shape: what a recording flattens → the room as an instrument → the crowd as an instrument → the mistakes that make it once-only.','First sentence: “The recording is the song. The concert is the song plus the room plus a thousand people breathing with it.”'] },
  { id:'s43', cat:'explain', topic:'Explain how a vaccine trains the body — to an elder who is wary of the word.', reader:'A wary elder', cues:['the smallpox scar','the polio drops queue','a wanted poster','the watchman\'s memory','a fire drill','sore arm, two days'], hints:['One metaphor, held all the way: a wanted poster shown to the body’s guards before the thief arrives.','Shape: the guards need a face → the vaccine is the poster, not the thief → the drill the body runs → why the real thing then loses.','First sentence: “A vaccine is a wanted poster. The illness is the thief, and the poster arrives first.”'] },
  { id:'s44', cat:'explain', topic:'Explain the traffic jam that appears from nowhere and melts away with no accident in sight — to a carpool stuck in one.', reader:'Your carpool, right now', cues:['one brake tap','four seconds per car','a lorry shifting gear','the flyover merge','the toll plaza behind','an accordion closing'], hints:['One tap of the brakes travels backwards through traffic like a wave, growing as it goes.','Shape: one driver brakes lightly → the car behind brakes harder → the wave rolls backward and parks → why it dissolves from the front → the one driving habit that starves it.','First sentence: “Somewhere two kilometres ahead, a driver touched his brakes five minutes ago, and we are living inside his echo.”'] },
  { id:'s45', cat:'explain', topic:'Explain how a letter with six lines of address finds one door among a billion people — to a kid who has never posted one.', reader:'A kid holding a stamped envelope', cues:['the six-digit PIN','the red pillar box','the round date stamp','the night mail van','the postman\'s rubber band','600 letters, one bag'], hints:['The address is read backwards — state, city, code, street — like a map zooming in.','Shape: the postbox and the first sort → the PIN code as the zoom lever → hop by hop to the local office → the postman’s memory as the last mile.','First sentence: “This address is a set of directions read backwards, and the post office reads it like a map zooming in.”'] },
  { id:'s46', cat:'story', topic:'Tell the story of a time a total stranger helped you — build the scene before the help arrives.', reader:'Friends at dinner', cues:['a punctured tyre','a phone at 3%','rain on the highway','the last bus gone','only a ₹500 note','a half-shut shutter'], hints:['The story is the trouble, told properly; the stranger enters late and leaves early.','Shape: the situation going wrong → the moment of being stuck → the stranger’s entrance → what they did → the detail about them you still remember.','First sentence: “I never learned his name, and I have thought about him more than some people I see weekly.”'] },

/* ================= STATE ================= */
const LS_KEY = 'practice.v1';
function loadState() {
  try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.v === 1) return s; } catch (e) {}
  return { v: 1, days: {} };
}
function saveState() { localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }
const STATE = loadState();
function dayRec(k) {
  if (!STATE.days[k]) STATE.days[k] = { write: null, speak: null, rest: false, intention: '', swaps: {}, hints: {}, fw: null, override: {} };
  return STATE.days[k];
}

function dkey(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}
const TODAY = new Date();
const TKEY = dkey(TODAY);
const NICE_DATE = TODAY.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });

function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h; }

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

/* topic of the day, per track; a Library override wins; excludes topics already used in analyzed reps */
function topicFor(track, key) {
  const bank = track === 'write' ? WRITE_BANK : SPEAK_BANK;
  const rec = dayRec(key);
  if (rec.override && rec.override[track]) {
    const chosen = bank.find(t => t.id === rec.override[track]);
    if (chosen) return chosen;
  }
  const used = new Set(BAKED.usedTopicIds);
  const pool = bank.filter(t => !used.has(t.id));
  if (!pool.length) return bank[0];
  const swap = (rec.swaps && rec.swaps[track]) || 0;
  const idx = (hashStr(key + ':' + track) + swap) % pool.length;
  return pool[idx];
}

/* ================= TABS ================= */
const tabs = document.querySelectorAll('nav.tabs button');
tabs.forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
function showTab(name) {
  tabs.forEach(b => { if (b.dataset.tab === name) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('active', s.id === 'tab-' + name));
  if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  window.scrollTo(0, 0);
}
if (location.hash && document.getElementById('tab-' + location.hash.slice(1))) showTab(location.hash.slice(1));

/* ================= RENDER: TODAY ================= */
function consecutiveEmptyDaysBefore(today) {
  let n = 0;
  for (let i = 1; i <= 14; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const k = dkey(d);
    const local = STATE.days[k];
    const baked = BAKED.calendar[k];
    const any = (baked && (baked.write || baked.speak)) || (local && (local.write || local.speak || local.rest));
    if (any) break;
    n++;
  }
  return n;
}

function hintLadderHTML(topic, track) {
  const rec = dayRec(TKEY);
  const revealed = (rec.hints && rec.hints[topic.id]) || 0;
  let html = '<div class="hint-block">';
  const labels = ['An angle', 'A skeleton', 'An opening line'];
  for (let i = 0; i < revealed && i < 3; i++) {
    html += `<div class="hint"><b>${labels[i]}:</b> ${esc(topic.hints[i])}</div>`;
  }
  if (revealed < 3) {
    html += `<div><button class="btn quiet" data-hint="${track}">${revealed === 0 ? 'Ask for a hint' : 'One more hint'} (${3 - revealed} left)</button></div>`;
  }
  html += '</div>';
  return html;
}

/* Cue words are prep material, not answers — one tap, no staging, no cost.
   They exist to make a concrete instance almost unavoidable, which is the standing focus item. */
function cueHTML(topic, track) {
  if (!topic.cues || !topic.cues.length) return '';
  const rec = dayRec(TKEY);
  const open = !!(rec.cues && rec.cues[topic.id]);
  if (!open) {
    return `<div class="cue-block"><button class="btn quiet" data-cue="${track}">Cue words (${topic.cues.length})</button></div>`;
  }
  return `<div class="cue-block">
    <div class="cue-lead">Cue words — things you could actually point at</div>
    <div class="cue-row">${topic.cues.map(c => `<span class="cue">${esc(c)}</span>`).join('')}</div>
    <p class="quiet-note" style="margin-top:6px">Pick one and make it the instance in your take. Ignoring all of them is fine too.</p>
  </div>`;
}

function signpostHTML(frameKey) {
  const f = FRAMEWORKS.find(x => x.k === frameKey);
  if (!f || !f.cues || !f.cues.length) return '';
  const slots = (f.slots && f.slots.length === f.cues.length) ? f.slots : f.cues.map(() => '');
  return `<div class="cue-block">
    <div class="cue-lead">Say the joints out loud</div>
    <ul class="signposts">${f.cues.map((c, i) => `<li>${slots[i] ? `<span class="slot">${esc(slots[i])}</span>` : ''}“${esc(c)}”</li>`).join('')}</ul>
  </div>`;
}

function renderToday() {
  const el = document.getElementById('tab-today');
  const rec = dayRec(TKEY);
  const wTopic = topicFor('write', TKEY);
  const sTopic = topicFor('speak', TKEY);
  const isMonday = TODAY.getDay() === 1;
  const isFirst = TODAY.getDate() === 1;
  const emptyBefore = consecutiveEmptyDaysBefore(TODAY);

  let html = `<p class="quiet-note" style="margin:4px 0 14px">${NICE_DATE}</p>`;

  if (isMonday || isFirst) html += `<p class="fresh">New ${isFirst ? 'month' : 'week'}. Last ${isFirst ? 'month' : 'week'} is archived — it doesn’t carry into this one.</p>`;
  if (emptyBefore === 2 && !rec.write && !rec.speak && !rec.rest) {
    html += `<p class="fresh">A five-minute rep counts. Today’s speaking topic is two minutes long.</p>`;
  }

  // yesterday's intention, shown back
  const yest = new Date(TODAY); yest.setDate(yest.getDate() - 1);
  const yestRec = STATE.days[dkey(yest)];
  if (yestRec && yestRec.intention) {
    html += `<p class="fresh">Yesterday’s note: today’s rep happens after <b>${esc(yestRec.intention)}</b>.</p>`;
  }

  // WRITE card
  const wAssign = BAKED.assignments.write;
  html += `<div class="card">
    <div class="eyebrow"><span class="dot w"></span> Writing — one page, 20 minutes</div>`;
  if (wAssign && wAssign.status === 'awaiting-read') {
    html += `<p class="reader-line"><b>${esc(wAssign.label)}</b> — ${esc(wAssign.sub)}</p><hr class="divider">`;
  }
  html += `<div class="topic serif">${esc(wTopic.topic)}</div>
    <p class="reader-line">Reader: <b>${esc(wTopic.reader)}</b> — name them at the top of the page.</p>`;
  if (BAKED.focus.write) html += `<div class="chips"><span class="chip focus-chip">This rep’s one focus: ${esc(BAKED.focus.write.text)}</span></div>`;
  html += hintLadderHTML(wTopic, 'write');
  html += `<div class="btnrow">
    <button class="btn" data-goto="write">Open the desk (timer &amp; rules)</button>
    <button class="btn quiet" data-swap="write">Different topic</button>
  </div>`;
  html += statusLineHTML('write', rec);
  html += `</div>`;

  // SPEAK card
  html += `<div class="card">
    <div class="eyebrow"><span class="dot s"></span> Speaking — two minutes, out loud</div>
    <div class="topic serif">${esc(sTopic.topic)}</div>
    <p class="reader-line">Audience: <b>${esc(sTopic.reader)}</b> — speak to them, not to the recorder.</p>`;
  if (BAKED.focus.speak) html += `<div class="chips"><span class="chip focus-chip s">This rep’s one focus: ${esc(BAKED.focus.speak.text)}</span></div>`;
  html += cueHTML(sTopic, 'speak');
  html += hintLadderHTML(sTopic, 'speak');
  html += `<div class="btnrow">
    <button class="btn" data-goto="speak">Open the booth (prep &amp; recorder)</button>
    <button class="btn quiet" data-swap="speak">Different topic</button>
  </div>`;
  html += statusLineHTML('speak', rec);
  html += `</div>`;

  // intention + rest
  html += `<div class="card intention">
    <div class="eyebrow">Tomorrow</div>
    <input type="text" id="intention" maxlength="80" placeholder="Tomorrow’s rep happens after … (optional — e.g. “morning chai”)" value="${esc(rec.intention || '')}">
    <div class="btnrow">
      <button class="btn quiet" id="rest-btn">${rec.rest ? 'Resting today ✓' : 'Resting today'}</button>
    </div>
    <p class="quiet-note" style="margin-top:8px">Rest is logged as a decision, not a gap. An empty day is just empty — it means nothing about you.</p>
  </div>`;

  el.innerHTML = html;

  el.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.goto)));
  el.querySelectorAll('[data-swap]').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.swap; const r = dayRec(TKEY);
    r.swaps = r.swaps || {}; r.swaps[t] = (r.swaps[t] || 0) + 1;
    if (r.override) delete r.override[t];
    saveState(); renderToday(); renderSpeak(); renderWrite();
  }));
  el.querySelectorAll('[data-hint]').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.hint; const topic = t === 'write' ? wTopic : sTopic;
    const r = dayRec(TKEY); r.hints = r.hints || {};
    r.hints[topic.id] = Math.min(3, (r.hints[topic.id] || 0) + 1);

  el.querySelectorAll('[data-cue]').forEach(b => b.addEventListener('click', () => {

    saveState(); renderToday(); renderSpeak();

  el.querySelectorAll('[data-done]').forEach(b => b.addEventListener('click', () => {

    r[t] = r[t] === 'sent' ? null : 'sent'; saveState(); renderToday();
  }));
  const intention = el.querySelector('#intention');
  intention.addEventListener('change', () => { dayRec(TKEY).intention = intention.value.trim(); saveState(); });
  el.querySelector('#rest-btn').addEventListener('click', () => {

}

function statusLineHTML(track, rec) {
  const baked = BAKED.calendar[TKEY];
  if (baked && baked[track]) return `<p class="status-line done">Done today — logged in the Reps tab.</p>`;
  if (rec[track] === 'sent') return `<p class="status-line done">Marked done — sent to Claude for the read. <button class="btn quiet" data-done="${track}">undo</button></p>`;
  return `<p class="status-line">When the ${track === 'write' ? 'photo' : 'recording'} is with Claude: <button class="btn quiet" data-done="${track}">mark it done</button></p>`;
}

let speakState = { phase: 'idle', t: 0, iv: null, rec: null, chunks: [], stream: null, url: null, mime: '', ctx: null, raf: null };

  if (speakState.stream) speakState.stream.getTracks().forEach(t => t.stop());
  if (speakState.ctx) { try { speakState.ctx.close(); } catch (e) {} }

    <div class="frameworks" id="fw-row" role="group" aria-label="Pick a frame">

    ${cueHTML(sTopic, 'speak')}

    <div class="btnrow"><button class="btn quiet" id="sw-speak">Different topic</button></div>
  </div>

  ${modelHTML(sTopic, 'speak')}

  <div class="card">
    <div class="eyebrow">Prep, then the window</div>
    <div class="timerbox">
      <div class="timer" id="st-display">1:00</div>
      <div class="timer-note" id="st-note">One minute to think. No notes — just pick the frame and your point.</div>
      <div class="window-track" id="st-track" hidden>
        <span data-at="60">1:00 — you may land it</span>
        <span data-at="90">1:30</span>
        <span data-at="120">2:00 — bring it home</span>
        <span data-at="150">2:30 — stop line</span>
      </div>
      <div class="btnrow" style="justify-content:center" id="st-buttons">
        <button class="btn primary s" id="st-main">Start prep</button>
      </div>
      <p class="quiet-note" style="margin-top:6px">The window is 1:00–2:30. A 70-second answer that lands its point is a full rep.</p>
    </div>
    <canvas class="meter" id="st-meter" hidden></canvas>
    <div id="st-playback"></div>
  </div>

  <div class="card" id="record-path">
    <div class="eyebrow">Recording</div>
    <p style="font-size:14.5px;margin:4px 0">Record on the nearest easy device, then get the file to Claude:</p>
    <ol style="margin:6px 0;padding-left:20px;font-size:14.5px">
      <li><b>iPhone:</b> Voice Memos → record → AirDrop to the Mac (or save to Files).</li>
      <li><b>Mac:</b> QuickTime Player → File → New Audio Recording.</li>

  /* in-page recorder: verified blocked in the published artifact today (permissions policy),

  el.querySelector('#mic-try').addEventListener('click', async () => {
