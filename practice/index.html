<meta name="robots" content="noindex, nofollow">
<title>The Practice Room</title>
<style>
  :root {
    --paper: #f7f6f3;
    --card: #ffffff;
    --ink: #22272e;
    --ink2: #59606b;
    --ink3: #70757e;
    --line: #e3e1da;
    --line-soft: #eeece6;
    --write: #2b4fc0;
    --speak: #1e8f58;
    --write-soft: #eaeefb;
    --speak-soft: #e3f2ea;
    --write-t: #2b4fc0;
    --speak-t: #136b41;
    --write-btn: #2b4fc0;
    --speak-btn: #157a4a;
    --amber-t: #8a6100;
    --amber-bg: #f5ebcf;
    --violet-t: #6d4fa3;
    --violet-bg: #ece4f7;
    --teal-t: #0e6a62;
    --teal-bg: #d9ecea;
    --win-t: #1e6f3e;
    --win-bg: #ddeee1;
    --slip-t: #6b7078;
    --focus-ring: #2b4fc0;
    --shadow: 0 1px 3px rgba(30, 35, 42, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #15181d;
      --card: #1d2127;
      --ink: #e7e5df;
      --ink2: #9aa0aa;
      --ink3: #858c96;
      --line: #2c313a;
      --line-soft: #262b33;
      --write: #6079d8;
      --speak: #2f9c66;
      --write-soft: #232c45;
      --speak-soft: #1d3227;
      --write-t: #93a7ec;
      --speak-t: #58b585;
      --write-btn: #4a63c4;
      --speak-btn: #1f7a4e;
      --amber-t: #d9b45c;
      --amber-bg: #3a3117;
      --violet-t: #b39ddb;
      --violet-bg: #322843;
      --teal-t: #6fbdb5;
      --teal-bg: #17332f;
      --win-t: #7cc79a;
      --win-bg: #1c3324;
      --slip-t: #9aa0aa;
      --focus-ring: #6079d8;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --paper: #15181d; --card: #1d2127; --ink: #e7e5df; --ink2: #9aa0aa; --ink3: #858c96;
    --line: #2c313a; --line-soft: #262b33;
    --write: #6079d8; --speak: #2f9c66; --write-soft: #232c45; --speak-soft: #1d3227;
    --write-t: #93a7ec; --speak-t: #58b585; --write-btn: #4a63c4; --speak-btn: #1f7a4e;
    --amber-t: #d9b45c; --amber-bg: #3a3117; --violet-t: #b39ddb; --violet-bg: #322843;
    --teal-t: #6fbdb5; --teal-bg: #17332f; --win-t: #7cc79a; --win-bg: #1c3324;
    --slip-t: #9aa0aa; --focus-ring: #6079d8; --shadow: none;
  }
  :root[data-theme="light"] {
    --paper: #f7f6f3; --card: #ffffff; --ink: #22272e; --ink2: #59606b; --ink3: #70757e;
    --line: #e3e1da; --line-soft: #eeece6;
    --write: #2b4fc0; --speak: #1e8f58; --write-soft: #eaeefb; --speak-soft: #e3f2ea;
    --write-t: #2b4fc0; --speak-t: #136b41; --write-btn: #2b4fc0; --speak-btn: #157a4a;
    --amber-t: #8a6100; --amber-bg: #f5ebcf; --violet-t: #6d4fa3; --violet-bg: #ece4f7;
    --teal-t: #0e6a62; --teal-bg: #d9ecea; --win-t: #1e6f3e; --win-bg: #ddeee1;
    --slip-t: #6b7078; --focus-ring: #2b4fc0; --shadow: 0 1px 3px rgba(30,35,42,.06);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 64px; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.55;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  /* in a too-narrow embed (viewer side panels), scroll — never collapse to one-letter lines */
  .wrap { max-width: 680px; min-width: 300px; margin: 0 auto; padding: 0 16px; }

  .serif { font-family: Charter, "Iowan Old Style", "Palatino Linotype", Georgia, serif; }
  .num { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }

  header.top { padding: 22px 0 4px; }
  .brand { font-family: Charter, "Iowan Old Style", Georgia, serif; font-size: 24px; font-weight: 700; letter-spacing: .2px; }
  .brand small { display: block; font-family: system-ui, sans-serif; font-weight: 400; font-size: 13px; color: var(--ink2); margin-top: 2px; }

  nav.tabs {
    position: sticky; top: 0; z-index: 20;
    background: var(--paper);
    display: flex; gap: 2px; overflow-x: auto;
    padding: 10px 0 8px; margin-bottom: 10px;
    border-bottom: 1px solid var(--line);
    scrollbar-width: none;
  }
  @media (max-width: 480px) {
    nav.tabs {
      mask-image: linear-gradient(to right, black 90%, transparent);
      -webkit-mask-image: linear-gradient(to right, black 90%, transparent);
    }
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    appearance: none; border: 1px solid transparent; background: none;
    font: inherit; font-size: 14px; color: var(--ink2);
    padding: 9px 12px; min-height: 40px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  }
  nav.tabs button[aria-current] { background: var(--card); border-color: var(--line); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
  nav.tabs button:focus-visible, .btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 2px solid var(--focus-ring); outline-offset: 2px;
  }

  section.tab { display: none; }
  section.tab.active { display: block; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink3); margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
  }
  .eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.w { background: var(--write); }
  .dot.s { background: var(--speak); }

  .topic { font-family: Charter, "Iowan Old Style", Georgia, serif; font-size: 19px; line-height: 1.4; text-wrap: balance; margin: 2px 0 6px; }
  .reader-line { font-size: 14px; color: var(--ink2); }
  .reader-line b { color: var(--ink); font-weight: 600; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font-size: 12.5px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ink2); background: none;
  }
  .chip.focus-chip { border-color: var(--write); color: var(--write-t); background: var(--write-soft); font-weight: 500; border-radius: 12px; padding: 6px 12px; }
  .chip.focus-chip.s { border-color: var(--speak); color: var(--speak-t); background: var(--speak-soft); }

  .btn {
    appearance: none; font: inherit; font-size: 14.5px; font-weight: 600;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    color: var(--ink); padding: 9px 14px; cursor: pointer;
  }
  .btn.primary.w { background: var(--write-btn); border-color: var(--write-btn); color: #fff; }
  .btn.primary.s { background: var(--speak-btn); border-color: var(--speak-btn); color: #fff; }
  .btn.quiet { border-color: transparent; color: var(--ink2); font-weight: 500; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  .hint-block { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .hint {
    font-size: 14.5px; padding: 10px 12px; border-radius: 8px;
    background: var(--line-soft); border-left: 3px solid var(--ink3);
  }
  .hint b { font-weight: 600; }

  .frameworks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .frameworks button {
    appearance: none; font: inherit; font-size: 12.5px; padding: 8px 12px;
    border-radius: 999px; border: 1px solid var(--line); background: none;
    color: var(--ink2); cursor: pointer;
  }
  .frameworks button[aria-pressed="true"] { border-color: var(--speak); color: var(--speak-t); background: var(--speak-soft); font-weight: 600; }
  /* cue words — concrete handles glanced at during prep, and spoken signposts per frame */
  .cue-block { margin-top: 12px; }
  .cue-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .cue {
    font-size: 13px; padding: 5px 11px; border-radius: 8px;
    border: 1px dashed var(--line); color: var(--ink); background: var(--card);
  }
  .cue-lead { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); }
  .signposts { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
  .signposts li {
    list-style: none; font-family: Charter, "Iowan Old Style", Georgia, serif;
    font-size: 14.5px; color: var(--ink);
  }
  .signposts li span.slot {
    font-family: system-ui, sans-serif; font-size: 11px; letter-spacing: .05em;
    text-transform: uppercase; color: var(--ink3); margin-right: 8px;
  }
  .signposts { padding: 0; margin-block: 6px 0; }
  .fw-skeleton { font-size: 14px; color: var(--ink2); margin-top: 8px; font-style: italic; }
  .fw-skeleton .serif { font-style: normal; }

  .timerbox { text-align: center; padding: 8px 0 4px; }
  .timer { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 44px; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .timer.window-open { color: var(--speak); }
  .timer.window-edge { color: var(--amber-t); }
  .timer-note { font-size: 13px; color: var(--ink2); min-height: 20px; }
  .window-track { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 10px 0 4px; }
  .window-track span {
    font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink3); white-space: nowrap;
  }
  .window-track span.lit { border-color: var(--amber-t); color: var(--amber-t); background: var(--amber-bg); }

  .meter { width: 100%; height: 36px; margin-top: 8px; border-radius: 6px; background: var(--line-soft); }

  .status-line { font-size: 14px; color: var(--ink2); margin-top: 10px; }
  .status-line.done { color: var(--win-t); font-weight: 500; }

  /* transcript markup — every category = color + a DIFFERENT line style (never color alone) */
  .transcript { font-family: Charter, "Iowan Old Style", Georgia, serif; font-size: 16.5px; line-height: 1.75; }
  .mk { border-radius: 3px; padding: 0 2px; }
  .transcript .mk { cursor: pointer; }
  .transcript .mk.active { outline: 2px solid currentColor; outline-offset: 1px; }
  .mk.filler { background: var(--amber-bg); color: var(--amber-t); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .mk.register { background: var(--violet-bg); color: var(--violet-t); text-decoration: underline wavy; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .mk.reasoning { background: var(--teal-bg); color: var(--teal-t); text-decoration: underline dotted; text-underline-offset: 3px; }
  .mk.win { background: var(--win-bg); color: var(--win-t); text-decoration: underline; text-underline-offset: 3px; }
  .mk.slip { color: var(--slip-t); text-decoration: underline dotted; text-underline-offset: 3px; }
  .mk-note {
    display: none; font-family: system-ui, sans-serif; font-size: 13.5px; line-height: 1.5;
    color: var(--ink2); background: var(--line-soft); border-radius: 8px; padding: 10px 12px; margin: 6px 0 10px;
  }
  .mk-note.open { display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12.5px; color: var(--ink2); margin: 10px 0 2px; }
  .legend .mk { cursor: default; }

  .statrow { display: flex; flex-wrap: wrap; gap: 14px 22px; margin: 10px 0 2px; }
  .stat .v { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 20px; font-variant-numeric: tabular-nums; font-weight: 500; }
  .stat .k { font-size: 12px; color: var(--ink3); }

  details.rep { border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin-bottom: 12px; box-shadow: var(--shadow); }
  details.rep summary { list-style: none; padding: 14px 16px; cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
  details.rep summary::-webkit-details-marker { display: none; }
  details.rep summary .when { font-size: 12.5px; color: var(--ink3); margin-left: auto; white-space: nowrap; }
  details.rep summary::after { content: "\25B8"; color: var(--ink3); font-size: 12px; }
  details.rep[open] summary::after { content: "\25BE"; }
  details.rep .body { padding: 0 16px 16px; border-top: 1px solid var(--line-soft); }
  .rep-title { font-weight: 600; font-size: 15px; }
  .pill { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; flex-shrink: 0; }
  .pill.w { color: var(--write-t); background: var(--write-soft); }
  .pill.s { color: var(--speak-t); background: var(--speak-soft); }
  .pill.awaiting { color: var(--ink2); background: var(--line-soft); font-weight: 500; }

  h4.blocklabel { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink3); margin: 18px 0 6px; }
  .analysis p { margin: 6px 0; }
  .analysis ul { margin: 4px 0; padding-left: 20px; }
  .analysis li { margin: 5px 0; }
  .verdict { display: inline-block; font-size: 13px; padding: 3px 10px; border-radius: 999px; font-weight: 600; }
  .verdict.yes { color: var(--win-t); background: var(--win-bg); }
  .verdict.partly { color: var(--amber-t); background: var(--amber-bg); }
  .verdict.notyet { color: var(--ink2); background: var(--line-soft); }

  .spark-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .spark-grid { grid-template-columns: 1fr; } }
  .spark { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--card); }
  .spark .k { font-size: 12.5px; color: var(--ink2); }
  .spark .v { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 22px; font-variant-numeric: tabular-nums; font-weight: 500; margin: 2px 0 4px; }
  .spark .v small { font-size: 12px; color: var(--ink3); font-weight: 400; }
  .spark svg { display: block; width: 100%; height: 44px; overflow: visible; }
  .spark .foot { font-size: 11.5px; color: var(--ink3); margin-top: 4px; }

  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
  .cal .day { text-align: center; padding: 6px 0 4px; border-radius: 8px; }
  .cal .day.today { background: var(--line-soft); }
  .cal .dnum { font-size: 11px; color: var(--ink3); }
  .cal .marks { display: flex; gap: 3px; justify-content: center; margin-top: 4px; min-height: 8px; }
  .cal .m { width: 7px; height: 7px; border-radius: 50%; }
  .cal .m.w-done { background: var(--write); }
  .cal .m.s-done { background: var(--speak); }
  .cal .m.empty { background: none; border: 1px solid var(--line); }
  .cal .rest { font-size: 11px; color: var(--ink3); line-height: 8px; }

  .lifetime { display: flex; flex-wrap: wrap; gap: 12px 28px; }
  .lifetime .stat .v { font-size: 26px; }

  .how p { margin: 8px 0; }
  .how ol { padding-left: 20px; }
  .how li { margin: 6px 0; }
  .quiet-note { font-size: 13px; color: var(--ink3); }
  .ref-note { font-size: 13px; color: var(--ink2); background: var(--line-soft); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }

  .intention input {
    width: 100%; font: inherit; font-size: 14.5px; color: var(--ink);
    background: none; border: none; border-bottom: 1px dashed var(--line);
    padding: 6px 2px;
  }
  .intention input::placeholder { color: var(--ink3); }

  .fresh { font-size: 14px; color: var(--ink2); margin-bottom: 14px; }
  .spark .ln.w, .spark .ref-w { stroke: var(--write); }
  .spark .ln.s, .spark .ref-s { stroke: var(--speak); }
  .spark .dot.w { fill: var(--write); }
  .spark .dot.s { fill: var(--speak); }

  audio { width: 100%; margin-top: 10px; }
  .divider { border: none; border-top: 1px solid var(--line-soft); margin: 14px 0; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">The Practice Room
      <small>One page written, two minutes spoken. A daily practice room for articulation and clear argument.</small>
    </div>
  </header>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="today" aria-current="page">Today</button>
    <button data-tab="speak">Speak</button>
    <button data-tab="write">Write</button>
    <button data-tab="drills">Drills</button>
    <button data-tab="library">Library</button>
    <button data-tab="reps">Reps</button>
    <button data-tab="trends">Trends</button>
    <button data-tab="standard">Standard</button>
    <button data-tab="method">Method</button>
  </nav>

  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-speak"></section>
  <section class="tab" id="tab-write"></section>
  <section class="tab" id="tab-drills"></section>
  <section class="tab" id="tab-library"></section>
  <section class="tab" id="tab-reps"></section>
  <section class="tab" id="tab-trends"></section>
  <section class="tab" id="tab-standard"></section>
  <section class="tab" id="tab-method"></section>
</div>

<script>
'use strict';

/* ================= BAKED DATA — written by Claude at each read, never by this page ================= */
const BAKED = {
  updated: '2026-07-29',
  /* The standard: named moves + the date each was first seen in a rep. Grows only. */
  standard: {
  "intro": "These are the fourteen moves a read looks for, named so a fix has a name that comes back instead of arriving fresh each time. The structural ones come from Barbara Minto's pyramid and the answer-first discipline consultancies drill into new hires; the rest are the standard reasoning scaffolds — warrant, qualifier, steelman, so-what. It is an inventory, not a score: a move carries the date it first shows up in the practice notes or the practice notes, where the logs record one, and nothing here totals, ranks, or can be fallen behind on. A card with no date has no date yet — that is all a blank means.",
  "moves": [
    {
      "id": "governing-thought",
      "name": "The governing thought",
      "family": "structure",
      "one_liner": "One sentence that is the whole answer — one idea, no \"and\" holding two together, and something a reasonable person could disagree with.",
      "test": "Can one complete sentence be quoted from the page or the transcript that states the whole claim, with no \"and\" or semicolon joining two different ideas, and that a reasonable person could disagree with? (An assertion, not a topic label — the test a slide's action title has to pass: \"Costs\" is a label, \"We are paying for capacity nobody uses\" is an action title.) Yes / not yet."
    },
    {
      "id": "answer-first",
      "name": "Answer first",
      "family": "structure",
      "one_liner": "The claim goes in the first two sentences on the page, or the first fifteen seconds of a take. Background comes after it.",
      "test": "Read only the first two sentences of the page, or play only the first 0:15 of the audio. Can the governing-thought sentence be written down from that alone, without the rest? (SCQA — Situation, Complication, Question, Answer: the S and C may sit inside that window, the Q is usually left implied out loud, the A has to land inside it.) Yes / not yet.",
    },
    {
      "id": "round-trip",
      "name": "The round trip",
      "family": "structure",
      "one_liner": "Close on the claim you opened with — different words, same point, nothing swapped in.",
      "test": "Put the governing-thought sentence and the last sentence's claim side by side. Are they the same claim pointing the same way — no new claim, no reversal, no swap to an adjacent point? (The same claim with the addressee or a number substituted in still counts as the same claim.) Yes / not yet.",
    },
    {
      "id": "key-line",
      "name": "The key line",
      "family": "structure",
      "one_liner": "Two or three supports under the claim, each a whole sentence, all the same kind of thing.",
      "test": "List the supports. Is each one a complete sentence someone could disagree with (not a label like \"cost\" or \"timing\"), and can the whole set be named with one plural noun — reasons, steps, causes — with no item overlapping or contained in another? (Minto's Rule 2 — every item the same kind of idea — plus the ME half of MECE: mutually exclusive, nothing overlapping. Collectively exhaustive, the CE half, is deliberately not required in a two-minute take: two reasons that hold beat four that cover the space.) If the supports are a deductive chain instead — this, therefore this, therefore the claim — the plural-noun test does not apply; check instead that each step follows from the one before and that the last step is the governing-thought sentence. Yes / not yet.",
    },
    {
      "id": "synthesis-close",
      "name": "The synthesis close",
      "family": "structure",
      "one_liner": "The last line is the point plus what changes because of it — its own sentence, not a clause tucked inside another.",
      "test": "Read the last sentence alone. Does it carry the claim AND something that follows from it — an action, a decision, what is different now? And is the why-it-matters a sentence of its own somewhere, rather than a subordinate clause? (Synthesis = the message the parts add up to; a summary = a restatement of what was said. Synthesis's main home is the governing thought; this card is that same operation performed again in the last slot, on the strength of what the middle established.) Yes / not yet.",
    },
    {
      "id": "concrete-instance",
      "name": "One concrete instance",
      "family": "evidence",
      "one_liner": "Put one real occasion in — one person, one date, one number, one thing that happened once — and say it before adding the next link.",
      "test": "Is there at least one sentence naming something that happened on a single occasion — a named person, a place, a date, a figure — as against what happens generally? Quote it. Yes / not yet.",
    },
    {
      "id": "so-what",
      "name": "The so-what",
      "family": "evidence",
      "one_liner": "No fact just sits there — each one gets a sentence saying what follows from it.",
      "test": "Take each fact offered as support for the claim — not the sentences inside a single narrated instance, which count as one unit — and ask \"so what?\". Is each one followed, within two sentences, by something that follows from it: a consequence, a decision, a change? Yes / not yet — if not yet, name the first fact left standing on its own.",
    },
    {
      "id": "reader-scale-number",
