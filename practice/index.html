    const btn = el.querySelector('#mic-try');
    if (speakState.rec && speakState.rec.state !== 'inactive') { stopRecorderIfLive(el); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder || !pickMime()) {
      verdict.textContent = 'This browser doesn’t expose a recorder here. Voice Memos is the path.'; return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      startRecorder(el, stream);
      btn.textContent = 'Stop recording';
      verdict.textContent = 'Recording — the level meter should be moving.';
    } catch (err) {
      verdict.textContent = 'The page isn’t allowed to use the microphone here (the site that hosts this page blocks it — not your settings). Voice Memos → AirDrop → Claude is the path.';
    }
  });
}

function pickMime() {
  if (!window.MediaRecorder) return '';
  const c = ['audio/webm;codecs=opus', 'audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm'];
  for (const m of c) { if (MediaRecorder.isTypeSupported(m)) return m; }
  return '';
}
function startRecorder(el, stream) {
  const mime = pickMime();
  if (!mime) { stream.getTracks().forEach(t => t.stop()); return; }
  speakState.stream = stream; speakState.chunks = []; speakState.mime = mime;
  const mr = new MediaRecorder(stream, { mimeType: mime });
  speakState.rec = mr;
  mr.ondataavailable = e => { if (e.data && e.data.size) speakState.chunks.push(e.data); };
  mr.onstop = () => finishRecording(el);
  stream.getTracks().forEach(t => { t.onended = () => { if (mr.state !== 'inactive') mr.stop(); }; });
  mr.start(1000); // 1s chunks: an interruption loses at most a second

  const meter = el.querySelector('#st-meter'); meter.hidden = false;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    speakState.ctx = ctx;
    const src = ctx.createMediaStreamSource(stream);
    const an = ctx.createAnalyser(); an.fftSize = 512; src.connect(an);
    const g = meter.getContext('2d'); const data = new Uint8Array(an.frequencyBinCount);
    (function draw() {
      speakState.raf = requestAnimationFrame(draw);
      an.getByteTimeDomainData(data);
      const w = meter.width = meter.clientWidth, h = meter.height = meter.clientHeight;
      g.clearRect(0, 0, w, h);
      g.strokeStyle = getComputedStyle(document.body).getPropertyValue('--speak').trim() || '#1e8f58';
      g.lineWidth = 1.5; g.beginPath();
      for (let i = 0; i < data.length; i++) {
        const x = i / data.length * w, y = (data[i] / 255) * h;
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.stroke();
    })();
  } catch (e) { /* level meter is optional */ }
}
function stopRecorderIfLive(el) {
  if (speakState.rec && speakState.rec.state !== 'inactive') speakState.rec.stop();
  if (speakState.raf) cancelAnimationFrame(speakState.raf);
  if (speakState.ctx) { try { speakState.ctx.close(); } catch (e) {} speakState.ctx = null; }
  const meter = el.querySelector('#st-meter'); if (meter) meter.hidden = true;
  const btn = el.querySelector('#mic-try'); if (btn) btn.textContent = 'Try recording right here instead';
}
function finishRecording(el) {
  if (speakState.stream) { speakState.stream.getTracks().forEach(t => t.stop()); speakState.stream = null; }
  if (!speakState.chunks.length) return;
  const blob = new Blob(speakState.chunks, { type: speakState.mime.split(';')[0] });
  if (speakState.url) URL.revokeObjectURL(speakState.url);
  speakState.url = URL.createObjectURL(blob);
  const saveExt = speakState.mime.includes('mp4') ? 'mp4' : 'webm';
  const box = el.querySelector('#st-playback');
  box.innerHTML = `<audio controls src="${speakState.url}"></audio>
    <div class="btnrow"><button class="btn" id="save-rec">Save the recording</button></div>
    <p class="quiet-note" id="save-note">Then drop the saved file into a Claude session and say “read this”.</p>`;
  const saveB = box.querySelector('#save-rec'), noteEl = box.querySelector('#save-note');
  if (!(window.claude && window.claude.downloads)) {
    saveB.remove();
    noteEl.textContent = 'Long-press the player to save, or record in Voice Memos next time.';
    return;
  }
  saveB.addEventListener('click', async () => {
    try {
      await window.claude.downloads.save({ filename: `speak-${TKEY}.${saveExt}`, data: blob });
      noteEl.textContent = 'Saved. Drop it into a Claude session and say “read this”.';
    } catch (e) {
      if (e && e.code === 'declined') noteEl.textContent = 'No problem — it’s still playable above.';
      else if (e && e.code === 'rate_limited') noteEl.textContent = 'A save prompt is already open — try again in a moment.';
      else { saveB.remove(); noteEl.textContent = 'Saving isn’t available here — long-press the player to save it instead.'; }
    }
  });
}

/* ================= RENDER: REPS ================= */
function markCat(m) {
  return { filler: 'filler / hedge', register: 'register drift', reasoning: 'reasoning gap', win: 'what worked', slip: 'slip' }[m] || m;
}
function renderReps() {
  const el = document.getElementById('tab-reps');
  const reps = [...BAKED.reps].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.n - a.n));
  const shown = repsFilterApply(reps);
  let html = repsFilterHTML() + `<div class="legend card" style="margin-bottom:14px">
    <span><span class="mk win">worked</span></span>
    <span><span class="mk filler">filler / hedge</span></span>
    <span><span class="mk register">register drift</span></span>
    <span><span class="mk reasoning">reasoning gap</span></span>
    <span><span class="mk slip">slip</span></span>
    <span class="quiet-note" style="flex-basis:100%">Tap any marked phrase for its note. Marks are observations on the text, not verdicts on the writer.</span>
  </div>`;

  if (!shown.length) html += `<div class="card"><p>${reps.length ? 'Nothing on the record for this filter yet.' : 'No reps yet. The first one starts on the Today tab.'}</p></div>`;

  shown.forEach(r => {
    const pill = r.track === 'write' ? '<span class="pill w">writing</span>' : '<span class="pill s">speaking</span>';
    const state = r.status === 'read' ? '' : '<span class="pill awaiting">awaiting the read</span>';
    html += `<details class="rep" ${shown.length && r.id === shown[0].id ? 'open' : ''}>
      <summary>${pill} <span class="rep-title serif">Rep ${r.n} — ${esc(r.topic)}</span> ${state}<span class="when num">${r.date.slice(5)}</span></summary>
      <div class="body">`;
    if (r.stats) {
      html += `<div class="statrow" style="margin-top:12px">`;
      if (r.stats.words != null) html += `<div class="stat"><div class="v">${r.stats.words}</div><div class="k">words</div></div>`;
      if (r.stats.longest != null) html += `<div class="stat"><div class="v">${r.stats.longest}</div><div class="k">longest sentence</div></div>`;
      if (r.stats.hedges != null) html += `<div class="stat"><div class="v">${r.stats.hedges}</div><div class="k">hedges left in</div></div>`;
      if (r.stats.ari != null) html += `<div class="stat"><div class="v">${r.stats.ari}</div><div class="k">reading grade (ARI)</div></div>`;
      if (r.stats.length != null) html += `<div class="stat"><div class="v">${r.stats.length}</div><div class="k">spoken</div></div>`;
      if (r.stats.wpm != null) html += `<div class="stat"><div class="v">${r.stats.wpm}</div><div class="k">words / min</div></div>`;
      if (r.stats.fillersPer100 != null) html += `<div class="stat"><div class="v">≥${r.stats.fillersPer100}</div><div class="k">fillers / 100 words</div></div>`;
      html += `</div>`;
    }
    if (r.excelled) {
      html += `<h4 class="blocklabel">Where it worked</h4><div class="analysis"><ul>${r.excelled.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
    }
    if (r.focusCheck) {
      const v = r.focusCheck.verdict;
      html += `<h4 class="blocklabel">Last rep’s focus</h4>
        <p class="analysis" style="font-size:14.5px">“${esc(r.focusCheck.text)}” —
        <span class="verdict ${v === 'yes' ? 'yes' : v === 'partly' ? 'partly' : 'notyet'}">${v === 'yes' ? 'incorporated' : v === 'partly' ? 'partly there' : 'not yet — carried forward'}</span></p>`;
      if (r.focusCheck.note) html += `<p class="analysis quiet-note" style="margin-top:4px">${esc(r.focusCheck.note)}</p>`;
    }
    if (r.status === 'logged') {
      html += `<p class="analysis" style="margin-top:12px">${esc(r.note || 'Awaiting the read.')}</p>`;
    }
    if (r.marked) {
      html += `<h4 class="blocklabel">The page, marked</h4><div class="transcript" id="tr-${r.id}">`;
      r.marked.forEach((seg, i) => {
        if (seg.m) html += `<span class="mk ${seg.m}" data-note="${r.id}-${i}" role="button" tabindex="0" aria-expanded="false" title="${esc(markCat(seg.m))}">${esc(seg.t)}</span>`;
        else html += esc(seg.t);
      });
      html += `</div><div id="notes-${r.id}"></div>`;
    }
    if (r.workOn) {
      html += `<h4 class="blocklabel">The one thing to carry</h4><div class="analysis"><p>${esc(r.workOn)}</p></div>`;
    }
    if (r.challenge) {
      html += `<h4 class="blocklabel">Optional, decided before the clock starts</h4><div class="analysis"><p>${esc(r.challenge)}</p></div>`;
    }
    if (r.pattern) {
      html += `<h4 class="blocklabel">Pattern worth naming</h4><div class="analysis"><p>${esc(r.pattern)}</p></div>`;
    }
    if (r.closing) {
      html += `<h4 class="blocklabel">Closing note</h4><div class="analysis"><p>${esc(r.closing)}</p></div>`;
    }
    html += `</div></details>`;
  });
  el.innerHTML = html;
  wireRepsFilter(el);

  // tap-to-open notes
  BAKED.reps.filter(r => r.marked).forEach(r => {
    const tr = el.querySelector('#tr-' + r.id);
    if (!tr) return;
    tr.querySelectorAll('.mk[data-note]').forEach(sp => {
      const open = () => {
        const idx = sp.dataset.note.split('-').pop();
        const seg = r.marked[+idx];
        const holder = el.querySelector('#notes-' + r.id);
        const existing = holder.querySelector('.mk-note');
        const already = existing && existing.dataset.for === sp.dataset.note;
        holder.innerHTML = '';
        tr.querySelectorAll('.mk.active').forEach(m => { m.classList.remove('active'); m.setAttribute('aria-expanded', 'false'); });
        if (!already && seg.note) {
          const d = document.createElement('div');
          d.className = 'mk-note open'; d.dataset.for = sp.dataset.note;
          d.innerHTML = `<b>${esc(markCat(seg.m))}:</b> ${esc(seg.note)}`;
          holder.appendChild(d);
          sp.classList.add('active'); sp.setAttribute('aria-expanded', 'true');
          d.scrollIntoView({ block: 'nearest' });
        }
      };
      sp.addEventListener('click', open);
      sp.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    });
  });
}

/* ================= RENDER: TRENDS ================= */
function spark(cls, values, opts) {
  opts = opts || {};
  if (values.length < 2) {
    return `<svg viewBox="0 0 300 44" preserveAspectRatio="none" aria-hidden="true">
      ${values.map((v, i) => `<circle class="dot ${cls}" cx="${14 + i * 24}" cy="22" r="3.5"/>`).join('')}
    </svg>`;
  }
  const min = Math.min(...values), max = Math.max(...values);
  const pad = (max - min) === 0 ? 1 : (max - min) * 0.15;
  const lo = min - pad, hi = max + pad;
  const X = i => 6 + i * (288 / (values.length - 1));
  const Y = v => 40 - ((v - lo) / (hi - lo)) * 32;
  let refLine = '';
  if (opts.ref != null && opts.ref >= lo && opts.ref <= hi) {
    refLine = `<line x1="0" x2="300" y1="${Y(opts.ref)}" y2="${Y(opts.ref)}" stroke="currentColor" stroke-opacity=".55" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  }
  const pts = values.map((v, i) => `${X(i)},${Y(v)}`).join(' ');
  const last = values[values.length - 1];
  return `<svg viewBox="0 0 300 44" preserveAspectRatio="none" aria-hidden="true">
    ${refLine}
    <polyline class="ln ${cls}" points="${pts}" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle class="dot ${cls}" cx="${X(values.length - 1)}" cy="${Y(last)}" r="3.5"/>
  </svg>`;
}

function renderTrends() {
  const el = document.getElementById('tab-trends');

  const sReps = BAKED.reps.filter(r => r.track === 'speak' && r.status === 'read');
  const allLogged = BAKED.reps.length;

      <div class="stat"><div class="v num">${totWords}</div><div class="k">words written</div></div>
      <div class="stat"><div class="v num">${totMin ? totMin.toFixed(1) : '0'}</div><div class="k">minutes spoken</div></div>

  // 28-day calendar
  html += `<div class="card"><div class="eyebrow">Last four weeks</div><div class="cal">`;

    html += `<div class="day ${k === TKEY ? 'today' : ''}">
      <div class="dnum num">${d.getDate()}</div>
      <div class="marks">${
        rest && !wDone && !sDone ? '<span class="rest">—</span>' :
        `<span class="m ${wDone ? 'w-done' : 'empty'}"></span><span class="m ${sDone ? 's-done' : 'empty'}"></span>`

  }
  html += `</div><p class="quiet-note" style="margin-top:8px">
    <span class="m w-done" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--write)"></span> writing done &nbsp;
    <span class="m s-done" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--speak)"></span> speaking done &nbsp;
    — rested &nbsp; ○ not yet. An empty day is empty, nothing more.</p></div>`;

  // writing sparks
  html += `<div class="eyebrow" style="margin:16px 0 8px"><span class="dot w"></span> Writing, rep by rep</div><div class="spark-grid">`;
  html += sparkCard('Words on the page', wReps.map(r => r.stats && r.stats.words), 'w', 'one page usually lands around 300–400', null);
  html += sparkCard('Longest sentence', wReps.map(r => r.stats && r.stats.longest), 'w', 'shorter is cleaner', null);
  html += sparkCard('Hedges left in', wReps.map(r => r.stats && r.stats.hedges), 'w', 'zero is the habit', null);
  html += sparkCard('Reading grade (ARI)', wReps.map(r => r.stats && r.stats.ari), 'w', 'plainer is lower — everyday newspaper prose sits around grade 8–10', null);
  html += `</div>`;

  // speaking sparks
  html += `<div class="eyebrow" style="margin:16px 0 8px"><span class="dot s"></span> Speaking, rep by rep</div>`;
  if (!sReps.length) {
    html += `<div class="card"><p style="margin:4px 0">No speaking reps on the record yet. The first one defines the baseline — it can’t be wrong.</p></div>`;
  } else {
    html += `<div class="spark-grid">`;
    html += sparkCard('Fillers per 100 words (at least)', sReps.map(r => r.stats && r.stats.fillersPer100), 's', 'conversational norm ≈ 6 — reference, not target', 6);
    html += sparkCard('Words per minute', sReps.map(r => r.stats && r.stats.wpm), 's', 'the band is 115–180 — reference, not target', null);
    html += `</div>`;
  }

  html += `<div class="card" style="margin-top:14px">
    <div class="eyebrow">The record, portable</div>
    <p style="font-size:14.5px;margin:4px 0">Everything on this page — reps, reads, ticks — as one markdown file.</p>
    <div class="btnrow"><button class="btn" id="export-btn">Download the history</button></div>
    <p class="quiet-note" id="export-note"></p>
  </div>`;

  el.innerHTML = html;

  function sparkCard(label, vals, cls, foot, ref) {
    const clean = vals.filter(v => typeof v === 'number' && !isNaN(v));
    const last = clean.length ? clean[clean.length - 1] : null;
    return `<div class="spark"><div class="k">${label}</div>
      <div class="v">${last != null ? last : '—'}<small> latest</small></div>
      ${spark(cls, clean, { ref })}
      <div class="foot">${foot}${clean.length < 3 ? ' · a line needs 3 reps' : ''}</div></div>`;
  }

  const exB = el.querySelector('#export-btn'), exN = el.querySelector('#export-note');
  if (!(window.claude && window.claude.downloads)) {
    exB.disabled = true; exN.textContent = 'Export works when this page is opened from its claude.ai link.';
  } else {
    exB.addEventListener('click', async () => {
      try {
        await window.claude.downloads.save({ filename: 'practice-history.md', data: exportMarkdown() });
        exN.textContent = 'Saved.';
      } catch (e) {
        if (e && e.code === 'declined') exN.textContent = '';
        else if (e && e.code === 'rate_limited') exN.textContent = 'A prompt is already open — try again in a moment.';
        else exN.textContent = 'Export isn’t available in this view.';
      }
    });
  }
}

function exportMarkdown() {
  let md = `# The Practice Room — history\n\nExported ${TKEY}. Analyses are written by Claude; ticks and notes are from this device.\n\n`;
  [...BAKED.reps].sort((a, b) => a.date < b.date ? -1 : 1).forEach(r => {
    md += `## Rep ${r.n} (${r.track}) — ${r.date} — ${r.topic}\n\n`;
    if (r.stats) md += Object.entries(r.stats).map(([k, v]) => `- ${k}: ${v}`).join('\n') + '\n';
    if (r.focusCheck) md += `- last focus: "${r.focusCheck.text}" → ${r.focusCheck.verdict}\n`;
    if (r.excelled) md += `\nWorked:\n` + r.excelled.map(x => `- ${x}`).join('\n') + '\n';
    if (r.workOn) md += `\nOne thing: ${r.workOn}\n`;
    if (r.pattern) md += `\nPattern: ${r.pattern}\n`;
    md += '\n';
  });
  md += `## Day ticks (this device)\n\n`;
  Object.keys(STATE.days).sort().forEach(k => {
    const d = STATE.days[k];
    const bits = [];
    if (d.write === 'sent') bits.push('writing sent');
    if (d.speak === 'sent') bits.push('speaking sent');
    if (d.rest) bits.push('rested');
    if (d.intention) bits.push(`intention: after ${d.intention}`);
    if (bits.length) md += `- ${k}: ${bits.join(' · ')}\n`;
  });
  return md;
}

/* ================= RENDER: METHOD ================= */
const METHOD_HTML = `  <p class="quiet-note" style="margin:4px 0 14px">Why the page works the way it does. The How tab is the short version; this is the reasoning behind it.</p>

  <div class="card how">
    <div class="eyebrow">The loop</div>
    <p>This page hands out the day’s two topics — one to write, a different one to speak — plus staged hints, frames, and timers. You produce the rep: one handwritten page, or two spoken minutes. Claude does the read, from the photo or the recording, in a session. The read lands back here as a marked page, stats, and one thing to carry.</p>
    <p>The page itself never analyzes anything. It has no opinions and runs no formulas — every mark on it was written from your actual sentences, after the fact. Here, it is a topic dispenser and a filing cabinet. That split is the design: the tool that prompts you is not the tool that judges the work, so opening it costs nothing.</p>
  </div>

  <div class="card how">
    <div class="eyebrow">One fix at a time</div>
    <p>Each read produces exactly one thing to work on. Not the top three, not a ranked list — one.</p>
    <div class="ref-note"><b>Why one:</b> focused correction is the replicated result in feedback research — correct one error type and the gain holds months later; mark everything and nothing in particular improves, because the marks blur into “this was bad”, which is not usable information (Bitchener 2008).</div>
    <p>The fix travels. It becomes the focus chip on the next rep’s card, and the next read opens by checking it: incorporated, partly, or not yet. “Not yet” just carries it forward — it costs nothing and means the fix was harder than one rep, which is information, not failure.</p>
  </div>

  <div class="card how">
    <div class="eyebrow">The five marks</div>
    <p><span class="mk win">worked</span> — a phrase that did its job. Every read must find at least one; it is the only mandatory mark.</p>
    <p><span class="mk filler">filler</span> — a word the sentence is better without. Struck through, because the sentence underneath is already fine.</p>
    <p><span class="mk register">register</span> — the named reader stopped being able to follow: jargon, textbook voice, a sentence written for an examiner instead of Mom.</p>
    <p><span class="mk reasoning">reasoning</span> — the critical-thinking half of the practice: a claim with no reason under it, a missing example, an objection ducked, or “happened together” quietly promoted to “caused”.</p>
    <p><span class="mk slip">slip</span> — mechanical debris. Noted so it can be fixed, never dwelt on.</p>
    <p class="quiet-note">Every mark sits on a phrase and carries a note saying why. Marks are observations on the text, not verdicts on the writer.</p>
  </div>

  <div class="card how">
    <div class="eyebrow">How the numbers behave</div>
    <p>Filler counts are floors. Transcription catches roughly 40% of real ums, so the page says “at least N per 100 words” and never pretends to more precision than it has.</p>
    <div class="ref-note"><b>Reference points, not targets:</b> ordinary conversation runs about 6 fillers per 100 words, with um/uh alone around 1 (Bortfeld 2001). The speaking pace band is 115–180 words a minute. These exist so a number has context — not so it has a pass mark.</div>
    <p>There is no composite score, and that is deliberate, twice over. First: a single number on a bad-morning rep reads as a verdict on the person, not on the rep. Second: it hides the actual news. Fillers can fall while pace wobbles — three separate lines show exactly that; one blended number shows a stall that isn’t happening.</p>
  </div>

  <div class="card how">
    <div class="eyebrow">Pauses</div>
    <p>Silence is not a fault. A pause taken to plan the next piece of the argument is what fluent speakers do — the reads mark those as healthy and say so, out loud, every time.</p>
    <p>What counts against fluency is narrower: pauses spent hunting for a word, restarts, and sentences abandoned mid-air. The fault the reads actually watch for is the opposite of silence — rushing to fill it, which is where the ums and the abandoned sentences come from.</p>
    <div class="ref-note">The IELTS top-band descriptors draw the same line: content-planning hesitation is normal at bands 8–9; it is language-hunting hesitation that marks the lower bands. Pausing to think is not a symptom. It is the skill.</div>
  </div>

  <div class="card how">
    <div class="eyebrow">What was left out, on purpose</div>
    <p>No streaks. A streak is a loss frame — every day it exists, it is a thing that can break, and the day it breaks the mechanic charges you for all the days you showed up. Duolingo’s own churn numbers pushed it to sell streak-freezes: the feature generates enough anxiety that its maker monetizes the antidote. Nothing here can break.</p>
    <p>No red, because red reads as an alarm about the person, not information about the text. No grades, no pass/fail, no score out of 100 — a rep is evidence, not an exam.</p>
    <p>Everything counted on this page counts upward: reps, words, minutes. A missed day renders as nothing at all — not a broken chain, not a gap to explain. Empty means empty.</p>
  </div>

  <div class="card how">
    <div class="eyebrow">The shape of a read</div>
    <p>Reads follow the Toastmasters evaluation form, which has survived decades of use on nervous speakers: open on something that worked, close on something that worked, and in between, be specific.</p>
    <p>Two or three commendations, each quoting the actual sentence it praises — generic praise is banned, because praise that could apply to anyone’s page teaches nothing about yours. Exactly one recommendation, which becomes the next rep’s focus chip. One optional challenge, for a rep with appetite left over.</p>
    <hr class="divider">
    <p class="quiet-note">The quoting rule cuts both ways. A commendation is on a sentence; a mark is on a sentence. Nothing in a read is about the writer — it is all about the page, and a page can be changed.</p>
  </div>`;

/* ===== MODEL ANSWERS =====
   Worked examples: comparison against a model beats correction alone. Gated behind a tap
   so the attempt happens first — reading the model before writing is copying, not practice. */
function modelHTML(topic, track) {
  const m = (BAKED.models || {})[topic.id];
  const rec = dayRec(TKEY);
  const shown = !!(rec.models && rec.models[topic.id]);
  let html = `<div class="card"><div class="eyebrow">A model answer</div>`;
  if (!m) {
    html += `<p style="margin:4px 0;font-size:14.5px">No model written for this topic yet. You can have one made: copy the prompt below into a Claude session and it will write one to the same standard, then mark up which move each sentence performs.</p>`;
  } else if (!shown) {
    html += `<p style="margin:4px 0;font-size:14.5px">There is a model answer for this topic — built answer-first, one governing claim, one real instance, the strongest objection addressed, closing on the opening claim.</p>
      <p class="quiet-note">Do your own take first. Reading it beforehand turns the rep into copying, and the comparison afterwards is where the learning actually is.</p>
      <div class="btnrow"><button class="btn" data-model="${esc(topic.id)}">Show the model (after my take)</button></div>`;
  } else {
    html += `<div class="topic serif" style="font-size:16px">${esc(m.topic || topic.topic)}</div>
      <p class="reader-line">${esc(m.pacing_note || ((m.mode === 'speak' ? 'Spoken' : 'Written') + ' model' + (m.word_count ? ` — ${m.word_count} words` : '')))}</p>
      ${m.slots_note ? `<p class="quiet-note">${esc(m.slots_note)}</p>` : ''}
      <div class="transcript" style="margin-top:10px">${esc(m.model_answer).replace(/\n\n/g, '</p><p>').replace(/^/, '<p>').replace(/$/, '</p>')}</div>`;
    if (m.annotations && m.annotations.length) {
      html += `<h4 class="blocklabel">What each part is doing</h4><div class="analysis"><ul>`;
      m.annotations.forEach(a => {
        html += `<li><b>${esc(a.move)}</b> — “${esc(a.quote)}” <span class="quiet-note">${esc(a.why)}</span></li>`;
      });
      html += `</ul></div>`;
    }
    if (m.contrast) {
      html += `<h4 class="blocklabel">Beside the reps on the board</h4><div class="analysis"><p>${esc(m.contrast)}</p></div>`;
    }
    html += `<div class="btnrow"><button class="btn quiet" data-model-hide="${esc(topic.id)}">Hide it again</button></div>`;
  }
  html += `<div class="btnrow"><button class="btn quiet" data-modelprompt="${esc(topic.id)}:${track}">Copy a prompt for a fresh model answer</button></div>
    <p class="quiet-note" id="mp-note-${esc(topic.id)}"></p></div>`;
  return html;
}

/* The page cannot call Claude. It can hand him the exact prompt to paste into a session —
   which is also the honest place for the analysis to live, since only Claude reads his real work. */
function modelPrompt(topic, track) {
  const focus = (BAKED.focus && BAKED.focus[track === 'speak' ? 'speak' : 'write']) || null;
  const isSpeak = track === 'speak';
  return `Write me a model answer for this practice topic, then mark it up.

TOPIC: ${topic.topic}
AUDIENCE: ${topic.reader}
MODE: ${isSpeak ? 'spoken, 1:00–2:30 (about 150–330 words at my pace of ~136 wpm)' : 'written by hand, one page (about 300–400 words)'}
${focus ? `MY CURRENT FOCUS ITEM: ${focus.text}` : ''}

Build it to the standard on my practice page:
1. Answer first. The governing claim is the first sentence — not a preamble, not the topic restated.
2. One governing claim only, and everything under it supports that claim.
3. Two or three supporting branches, each the same kind of idea, none overlapping or contained in another (the ME half of MECE — collectively exhaustive is deliberately not required in a two-minute take).
4. At least one concrete instance: one person, one stretch of time, one change someone observed. Not a hypothetical.
5. Address the strongest objection from the other side, in one sentence, and answer it.
6. Close by returning to the opening claim, sharper — not a summary of where the argument wandered.
7. Ordinary human sentences. If it reads like a consulting deck or a textbook, rewrite it.

Then, after the model:
- Quote each sentence that performs one of those moves and name the move.
- Tell me the one sentence in the model that carries the most weight, and why.

Rules that matter: no comparisons to named people, no scores or grades, and do not comment on my habits. Keep the subject outward-facing.`;
}

function wireModelButtons(el, topics) {
  el.querySelectorAll('[data-model]').forEach(b => b.addEventListener('click', () => {
    const r = dayRec(TKEY); r.models = r.models || {}; r.models[b.dataset.model] = 1;
    saveState(); renderToday(); renderSpeak(); renderWrite();
  }));
  el.querySelectorAll('[data-model-hide]').forEach(b => b.addEventListener('click', () => {
    const r = dayRec(TKEY); if (r.models) delete r.models[b.dataset.modelHide];
    saveState(); renderToday(); renderSpeak(); renderWrite();
  }));
  el.querySelectorAll('[data-modelprompt]').forEach(b => b.addEventListener('click', async () => {
    const [id, track] = b.dataset.modelprompt.split(':');
    const topic = topics.find(t => t.id === id);
    if (!topic) return;
    const note = el.querySelector('#mp-note-' + id);
    const text = modelPrompt(topic, track);
    try {
      await navigator.clipboard.writeText(text);
      if (note) note.textContent = 'Copied. Paste it into a Claude session.';
    } catch (e) {
      if (note) {
        note.innerHTML = 'Copy did not work here — select this and copy it by hand:';
        const ta = document.createElement('textarea');
        ta.readOnly = true; ta.rows = 10; ta.value = text;

        note.after(ta); ta.select();

    }
  }));
}

let drillClocks = { qa: null, ts: null, sp: null, spAmber: null };

function drillStopAll() {
  if (drillClocks.qa) clearInterval(drillClocks.qa);

  drillClocks = { qa: null, ts: null, sp: null, spAmber: null };
}

function drillPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function drillPickN(arr, n) {
  const pool = arr.slice(), out = [];
  while (out.length < n && pool.length) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  return out;
}
function drillFmt(t) { return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; }

    obCount = 0;

let libTrack = 'all';   // 'all' | 'write' | 'speak'
let libCat = 'all';
let libSearch = '';
let libShown = 20;      // "show more" cap; resets whenever a filter or the search changes
let libHints = {};      // topicId -> hints revealed on the shelf. Session-only, never saved.
let libOpen = {};       // topicId -> card expanded. Read back from the DOM before each repaint.

const LIB_PAGE = 20;

function libPool() {
  return WRITE_BANK.map(t => ({ t, track: 'write' }))
    .concat(SPEAK_BANK.map(t => ({ t, track: 'speak' })));
}

function libMatches() {
  const q = libSearch.trim().toLowerCase();
  return libPool().filter(x => {
    if (libTrack !== 'all' && x.track !== libTrack) return false;
    if (libCat !== 'all' && x.t.cat !== libCat) return false;
    if (q && !(x.t.topic + ' ' + x.t.cat + ' ' + x.t.reader).toLowerCase().includes(q)) return false;
    return true;
  });
}

/* same ladder as the Today tab: staged, free, and worded as an offer */
function libHintLadder(t) {
  const revealed = Math.min(3, libHints[t.id] || 0);
  const labels = ['An angle', 'A skeleton', 'An opening line'];
  let html = '<div class="hint-block">';
  for (let i = 0; i < revealed; i++) {
    html += `<div class="hint"><b>${labels[i]}:</b> ${esc(t.hints[i])}</div>`;
  }
  if (revealed < 3) {
    html += `<div><button class="btn quiet" data-libhint="${esc(t.id)}">${revealed === 0 ? 'Ask for a hint' : 'One more hint'} (${3 - revealed} left)</button></div>`;
  }
  html += '</div>';
  return html;
}

function libItemHTML(x, used) {
  const t = x.t;
  const done = used.has(t.id);
  const pill = x.track === 'write' ? '<span class="pill w">writing</span>' : '<span class="pill s">speaking</span>';
  const donePill = done ? ' <span class="pill awaiting">done — on the record</span>' : '';
  const who = x.track === 'write' ? 'Reader' : 'Audience';

  let body = `<p class="reader-line" style="margin-top:12px">${who}: <b>${esc(t.reader)}</b></p>`;
  body += libHintLadder(t);
  if (done) {
    body += `<p class="quiet-note" style="margin-top:12px">Already practised — the read lives in the Reps tab.</p>`;
  } else {
    body += `<div class="btnrow"><button class="btn primary ${x.track === 'write' ? 'w' : 's'}" data-practice="${esc(t.id)}">Practice this today</button></div>`;
  }

  return `<details class="rep" data-lib="${esc(t.id)}"${libOpen[t.id] ? ' open' : ''}>
    <summary>${pill} <span class="rep-title serif">${esc(t.topic)}</span> <span class="chip">${esc(t.cat)}</span>${donePill}</summary>
    <div class="body">${body}</div>
  </details>`;
}

function renderLibrary() {
  const el = document.getElementById('tab-library');
  if (!el) return;
  const used = new Set(BAKED.usedTopicIds);

  el.innerHTML = `
  <div class="card">
    <div class="eyebrow">The shelf — every topic in both banks</div>
    <div class="intention"><input type="search" id="lib-q" maxlength="60" aria-label="Search the shelf" placeholder="Search topics, readers, categories…" value="${esc(libSearch)}"></div>
    <div class="frameworks" id="lib-tracks" role="group" aria-label="Filter by track"></div>
    <div class="frameworks" id="lib-cats" role="group" aria-label="Filter by category"></div>
    <p class="quiet-note" id="lib-count" style="margin-top:8px"></p>
  </div>
  <div id="lib-list"></div>`;

  const list = el.querySelector('#lib-list');
  const q = el.querySelector('#lib-q');

  function paintTracks() {
    const row = el.querySelector('#lib-tracks');
    row.innerHTML = [['all', 'All'], ['write', 'Writing'], ['speak', 'Speaking']]
      .map(([k, label]) => `<button data-trk="${k}" aria-pressed="${String(libTrack === k)}">${label}</button>`).join('');
    row.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      libTrack = b.dataset.trk; libCat = 'all'; libShown = LIB_PAGE;
      paintTracks(); paintCats(); paintList();
    }));
  }

  function paintCats() {
    const row = el.querySelector('#lib-cats');
    const pool = libPool().filter(x => libTrack === 'all' || x.track === libTrack);
    const cats = [];
    pool.forEach(x => { if (!cats.includes(x.t.cat)) cats.push(x.t.cat); });
    row.innerHTML = [`<button data-cat="all" aria-pressed="${String(libCat === 'all')}">All</button>`]
      .concat(cats.map(c => `<button data-cat="${esc(c)}" aria-pressed="${String(libCat === c)}">${esc(c)}</button>`))
      .join('');
    row.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      libCat = b.dataset.cat; libShown = LIB_PAGE;
      paintCats(); paintList();
    }));
  }

  function paintList() {
    // remember which cards were open before this repaint
    list.querySelectorAll('details[data-lib]').forEach(d => { libOpen[d.dataset.lib] = d.open; });

    const rows = libMatches();
    const visible = rows.slice(0, libShown);
    const total = libPool().length;
    el.querySelector('#lib-count').textContent =
      rows.length === total ? `${total} topics on the shelf.` :
      rows.length === 0 ? 'Nothing on the shelf matches that. Loosen the filter or the search.' :
      `${rows.length} ${rows.length === 1 ? 'topic matches' : 'topics match'}.`;

    let html = visible.map(x => libItemHTML(x, used)).join('');
    if (rows.length > libShown) {
      html += `<div class="btnrow" style="justify-content:center;margin-bottom:14px"><button class="btn quiet" id="lib-more">Show more</button></div>`;
    }
    list.innerHTML = html;

    const more = list.querySelector('#lib-more');
    if (more) more.addEventListener('click', () => { libShown += LIB_PAGE; paintList(); });

    list.querySelectorAll('[data-libhint]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.libhint;
      libHints[id] = Math.min(3, (libHints[id] || 0) + 1);
      paintList();
    }));

    list.querySelectorAll('[data-practice]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.practice;
      const hit = libPool().find(x => x.t.id === id);
      if (!hit) return;
      const r = dayRec(TKEY);
      r.override = Object.assign(r.override || {}, hit.track === 'write' ? { write: id } : { speak: id });
      saveState();
      if (typeof renderToday === 'function') renderToday();
      if (typeof renderWrite === 'function') renderWrite();
      if (typeof renderSpeak === 'function') renderSpeak();
      showTab(hit.track === 'write' ? 'write' : 'speak');
    }));
  }

  paintTracks(); paintCats(); paintList();

  // only the list repaints on keystrokes, so the input keeps focus
  q.addEventListener('input', () => { libSearch = q.value; libShown = LIB_PAGE; paintList(); });
}

// ---- REPS FILTER ----

let repsFilter = 'all'; // 'all' | 'write' | 'speak'

function repsFilterHTML() {
  return `<div class="frameworks" id="reps-filter" role="group" aria-label="Filter reps" style="margin:0 0 12px">${
    [['all', 'All'], ['write', 'Writing'], ['speak', 'Speaking']]
      .map(([k, label]) => `<button data-trk="${k}" aria-pressed="${String(repsFilter === k)}">${label}</button>`).join('')
  }</div>`;
}

function repsFilterApply(reps) {
  return repsFilter === 'all' ? reps : reps.filter(r => r.track === repsFilter);
}

function wireRepsFilter(el) {
  el.querySelectorAll('#reps-filter button').forEach(b => b.addEventListener('click', () => {
    repsFilter = b.dataset.trk;
    renderReps();
  }));
}

/* ================= BOOT ================= */
[renderToday, renderWrite, renderSpeak, renderDrills, renderLibrary, renderReps, renderTrends, renderStandard, renderMethod].forEach(f => {
  try { f(); } catch (e) { console.error(f.name, e); }
});

/* the page lives on a home screen — when it wakes up on a new day, start the new day */
function rolloverCheck() { if (dkey(new Date()) !== TKEY) location.reload(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) rolloverCheck(); });
window.addEventListener('focus', rolloverCheck);
</script>
